<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz</title>
  <style>
    * {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
        "Open Sans", "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-size: 16px;
    }

    main {
      padding-top: 48px;
    }

    :root {
      --large-device-width: 850px;
      --primary-color: #0f172a;
      --secondary-color: #020617;
      --primary-text-color: #c7d1dd;
      --secondary-text-color: #061602;
      --success-background: hsl(159, 82%, 24%);
      --success-foreground: hsl(164, 86%, 16%);
      --success: hsl(160, 84%, 39%);
      --danger: #ef4444;
      --warning: #f59e0b;
      --info-background: hsl(218, 81%, 8%);
      --info-foreground: hsl(217, 91%, 85%);
      --border-color: #d1d7dc;
      --check-box-size: 20px;
      /* control the size */
      --check-box-color: var(--info-foreground);
      /* the active color */
    }

    body {
      position: relative;
      background-color: #020617;
      color: var(--primary-text-color);
    }

    #score-stats-container {
      position: fixed;
      z-index: 10;
      top: 0;
      height: 40px;
      width: 100%;
      background-color: var(--info-background);

      padding: 0px 16px;
      color: var(--info-foreground);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #quiz-container {
      border-radius: 8px;
      display: flex;
      gap: 16px;
      flex-direction: column;
    }

    /* === Base Styles for both Radio and Checkbox === */
    input[type="radio"],
    input[type="checkbox"] {
        height: var(--check-box-size);
        aspect-ratio: 1;
        border: calc(var(--check-box-size) / 8) solid #939393;
        padding: calc(var(--check-box-size) / 8);
        background: radial-gradient(farthest-side, var(--check-box-color) 94%, #0000) 50%/0 0 no-repeat content-box;
        outline-offset: calc(var(--check-box-size) / 10);
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        cursor: pointer;
        font-size: inherit;
        transition: 0.3s;
    }

    input[type="radio"]:checked,
    input[type="checkbox"]:checked {
        border-color: var(--check-box-color);
        background-size: 100% 100%;
    }

    input[type="radio"]:disabled,
    input[type="checkbox"]:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* === Specific Styles === */
    input[type="radio"] {
      border-radius: 50%; /* Makes it a circle */
    }
    
    input[type="checkbox"] {
        border-radius: 4px; /* Makes it a square */
    }
    
    label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
    }

    @media (max-width: 767px) {

      input[type="radio"],
      input[type="checkbox"],
      label {
        cursor: default;
      }

      #quiz-container {
        margin-left: 8px;
        margin-right: 8px;
      }
    }

    /* PC (Desktop devices) */
    @media (min-width: 768px) {
      body {
        display: flex;
        justify-content: center;
      }

      main {
        max-width: var(--large-device-width);
      }

      #score-stats-container {
        max-width: var(--large-device-width);
      }

      dialog {
        max-width: var(--large-device-width);
      }
    }

    @media print {
        input[type="radio"],
        input[type="checkbox"] {
            background: none !important;
            border-color: #939393 !important;
        }

        input[type="radio"]:checked,
        input[type="checkbox"]:checked {
            border-color: #939393 !important;
        }
    }

    .question-lable {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .button {
      background-color: var(--success-background);
      border: none;
      color: #f4f5f7;
      opacity: 0.8;
      font-size: 18px;
      flex-grow: 1;
      padding: 8px 16px;
      border-radius: 8px;
    }

    .button:hover {
      opacity: 1;
    }

    .button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .explanation-btn {
      border: none;
      color: var(--success);
      background-color: transparent;
    }

    .single-question-container {
      background-color: var(--primary-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      border-radius: 8px;
    }

    #modal-content {
      padding: 16px;
      line-height: 24px;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    dialog {
      position: fixed;
      border: 1px solid var(--border-color);
      background-color: var(--primary-color);
      color: rgb(240, 241, 248);
      padding: 16px;
      border-radius: 8px;
      width: 80vw;
      max-height: 80vh;
      overflow: auto;
      top: 50%;
      left: 50%;
      transform: translateX(-50%) translateY(-50%);
    }

    #close-modal-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      padding: 2px 8px;
      border-radius: 2px;
      border: none;
      background-color: var(--danger);
    }

    .correct-answer > label {
      border: 2px solid var(--success);
      width: 100%;
    }

    .incorrect-answer > label {
      border: 2px solid var(--danger);
      width: 100%;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #quiz-meta-container {
      border-radius: 8px;
      background-color: var(--primary-color);
      margin-bottom: 12px;
      padding: 8px;
    }

    #quiz-title {
      text-align: center;
      font-size: 24px;
      margin-bottom: 8px;
    }

    #quiz-description {
      line-height: 1.5;
      padding: 2px 6px;
    }
  </style>
</head>

<body onload="main()">

      <p id="quiz-description"></p>
    </section>
    <section id="score-stats-container">
      <div id="score-card">
        Score: <span id="current-score">999</span> of
        <span id="pass-percent">999%</span>
      </div>
      <div>Correct: <span id="correct-answers">999</span></div>
      <div>Incorrect: <span id="wrong-answers">999</span></div>
    </section>

    <section id="quiz-container"></section>

    <dialog id="modal" class="modal-container">
      <div id="modal-content">
        <p id="modal-text"></p>
      </div>
    </dialog>
  </main>

  <script>
    const quizData = {"pass_percent": null, "questions": [{"_class": "assessment", "id": 4333398, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Multiple threads have an instance of the Metric class.</p><pre class=\"prettyprint linenums\">    public class Metric {\n        private long count;\n        private long sum;\n         \n        public void addSample(int sample) {\n            sum += sample;\n            count++;\n        }\n        \n        public double getAverage() {\n            double average = (double)sum/count;\n            reset();\n            return average;\n        }\n\n        private void reset() {\n            count = 0;\n            sum = 0;\n        }\n    }</pre><p>The threads use this instance to measure the execution time of a particular critical piece of code.</p><p>Example:</p><pre class=\"prettyprint linenums\">    private Metric metric;\n    public criticalMethod() {\n        long start = System.currentTimeMillis();\n        \n        someVeryImportantOperation();\n        \n        long end =  System.currentTimeMillis();;\n        \n        metric.addSample(end - start);\n    }</pre><p><br></p><p>Another thread called <em>Emitter </em>that also has a reference to that instance of the class, calls the <code>getAverage();</code> method once a minute. That thread sends the average of the execution of <code>criticalMethod()</code>, for the last minute, to an external server.</p><p><br></p><p><strong>Question :</strong></p><p>Is the class thread safe?</p>", "relatedLectureIds": ["11200098"], "feedbacks": ["Think about the race conditions that can occur when multiple threads add a sample concurrently. Add to that the race condition that may happen inside getAverage, between reading from sum and reading from count", "That's right, there is a race condition in almost every method here. Let's try to make it better in the next question. You are encouraged to try it yourself first!"], "answers": ["<p>Yes it is thread safe</p>", "<p>No, it is not thread safe.</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "Multiple threads have an instance of the Metric class.    public class Metric {\n        private long count;\n        private long sum;\n         \n        public void addSample(int sample) {\n            sum += sample;\n            count++;\n        }\n        \n        public double getAverage() {\n            double average = (double)sum/count;\n            reset();\n            return average;\n        }\n\n        private void reset() {\n            count = 0;\n            sum = 0;\n        }\n    }The threads use this instance to measure the execution time of a particular critical piece of code.Example:    private Metric metric;\n    public criticalMethod() {\n        long start = System.currentTimeMillis();\n        \n        someVeryImportantOperation();\n        \n        long end =  System.currentTimeMillis();;\n        \n        metric.addSample(end - start);\n    }Another thread called Emitter that also has a reference to that instance of the class, calls the getAverage(); method once a minute. That thread sends the average of the execution of criticalMethod(), for the last minute, to an external server.Question :Is the class thread safe?", "related_lectures": [{"_class": "lecture", "id": 11200098, "title": "Atomic Integers & Lock Free E-Commerce", "created": "2018-07-27T03:49:06Z", "is_published": true, "asset": {"_class": "asset", "id": 13577056, "asset_type": "Video", "title": "Lecture 19.mp4", "created": "2018-07-27T03:49:27Z"}, "object_index": 31, "url": "/course/java-multithreading-concurrency-performance-optimization/learn/lecture/11200098"}]}, {"_class": "assessment", "id": 4333562, "assessment_type": "multiple-choice", "prompt": {"relatedLectureIds": ["11200112"], "question": "<p>The previous code was modified in the attempt to make Metric a thread safe class.</p><p>We know that many threads are calling methods of this class concurrently, and we would like to make it lock-free if possible</p><pre class=\"prettyprint linenums\">    public class Metric {\n        private AtomicLong count = new AtomicLong(0);\n        private AtomicLong sum = new AtomicLong(0);\n\n        public void addSample(long sample) {\n            sum.addAndGet(sample);\n            count.incrementAndGet();\n        }\n\n        public double getAverage() {\n            double average = (double)sum.get()/count.get();\n            reset();\n            return average;\n        }\n\n        private void reset() {\n            count.set(0);\n            sum.set(0);\n        }\n    }</pre><p>Is the class thread safe now?</p>", "feedbacks": ["Well, some operations became thread safe, like incrementing of count, and sum. However because there are 2 variables here, modification and reading of them is not an atomic operation. Try to think of a race condition scenario in at least one method", "That's right! Some operations became thread safe, like sum.addAndGet(sample) or count.incrementAndGet();. However when we read or modify 2 variables, even if each individual operation on each variable is atomic, the aggregate operation is not"], "answers": ["<p>Yes, now it's thread-safe</p>", "<p>No, it is still not thread safe</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "The previous code was modified in the attempt to make Metric a thread safe class.We know that many threads are calling methods of this class concurrently, and we would like to make it lock-free if possible    public class Metric {\n        private AtomicLong count = new AtomicLong(0);\n        private AtomicLong sum = new AtomicLong(0);\n\n        public void addSample(long sample) {\n            sum.addAndGet(sample);\n            count.incrementAndGet();\n        }\n\n        public double getAverage() {\n            double average = (double)sum.get()/count.get();\n            reset();\n            return average;\n        }\n\n        private void reset() {\n            count.set(0);\n            sum.set(0);\n        }\n    }Is the class thread safe now?", "related_lectures": [{"_class": "lecture", "id": 11200112, "title": "Atomic References, Compare And Set, Lock-Free High Performance Data Structure", "created": "2018-07-27T03:50:11Z", "is_published": true, "asset": {"_class": "asset", "id": 13577064, "asset_type": "Video", "title": "Lecture 20.mp4", "created": "2018-07-27T03:51:05Z"}, "object_index": 32, "url": "/course/java-multithreading-concurrency-performance-optimization/learn/lecture/11200112"}]}, {"_class": "assessment", "id": 4333694, "assessment_type": "multiple-choice", "prompt": {"relatedLectureIds": ["11200112"], "answers": ["<p>Yes, now the class is thread safe.</p>", "<p>No, the class is still not thread-safe</p>"], "question": "<p>Now that we realized that the previous approach had a lot of race conditions, we know that just by turning all the variables in a shared class into atomic variables is not enough to make a class thread safe. </p><p>When designing lock-free data structures, we need to rethink how we design our classes from ground up:</p><p>Here is an attempt to make the class thread safe</p><pre class=\"prettyprint linenums\">private static class Metric {\n    private static class InternalMetric{\n        public long count;\n        public long sum;\n    }\n    \n    private AtomicReference&lt;InternalMetric&gt; internalMetric = new AtomicReference&lt;&gt;(new InternalMetric());\n\n    public void addSample(long sample) {\n        InternalMetric currentState;\n        InternalMetric newState;\n        do {\n            currentState = internalMetric.get();\n            newState = new InternalMetric();\n            newState.sum = currentState.sum + sample;\n            newState.count = currentState.count + 1;\n        } while (!internalMetric.compareAndSet(currentState, newState));\n    }\n\n    public double getAverage() {\n        InternalMetric newResetState = new InternalMetric();\n        InternalMetric currentState;    \n        double average;\n        do {\n            currentState = internalMetric.get();            \n            average = (double)currentState.sum / currentState.count;\n        } while (!internalMetric.compareAndSet(currentState,  newResetState));\n        \n        return average;\n    }        \n}</pre><p><strong>Question :</strong></p><p>Is the class thread safe now?</p>", "feedbacks": ["That's right! Now the class is thread safe. One thing to keep in mind is that we do allocate a bit more objects in this approach. So when your application is memory constrained, keep that in mind. ", "Try to go in your head through execution scenarios. Can you find any race conditions?"]}, "correct_response": ["a"], "section": "", "question_plain": "Now that we realized that the previous approach had a lot of race conditions, we know that just by turning all the variables in a shared class into atomic variables is not enough to make a class thread safe. When designing lock-free data structures, we need to rethink how we design our classes from ground up:Here is an attempt to make the class thread safeprivate static class Metric {\n    private static class InternalMetric{\n        public long count;\n        public long sum;\n    }\n    \n    private AtomicReference&lt;InternalMetric&gt; internalMetric = new AtomicReference&lt;&gt;(new InternalMetric());\n\n    public void addSample(long sample) {\n        InternalMetric currentState;\n        InternalMetric newState;\n        do {\n            currentState = internalMetric.get();\n            newState = new InternalMetric();\n            newState.sum = currentState.sum + sample;\n            newState.count = currentState.count + 1;\n        } while (!internalMetric.compareAndSet(currentState, newState));\n    }\n\n    public double getAverage() {\n        InternalMetric newResetState = new InternalMetric();\n        InternalMetric currentState;    \n        double average;\n        do {\n            currentState = internalMetric.get();            \n            average = (double)currentState.sum / currentState.count;\n        } while (!internalMetric.compareAndSet(currentState,  newResetState));\n        \n        return average;\n    }        \n}Question :Is the class thread safe now?", "related_lectures": [{"_class": "lecture", "id": 11200112, "title": "Atomic References, Compare And Set, Lock-Free High Performance Data Structure", "created": "2018-07-27T03:50:11Z", "is_published": true, "asset": {"_class": "asset", "id": 13577064, "asset_type": "Video", "title": "Lecture 20.mp4", "created": "2018-07-27T03:51:05Z"}, "object_index": 32, "url": "/course/java-multithreading-concurrency-performance-optimization/learn/lecture/11200112"}]}]};

     let correct = new Set();
    let incorrect = new Set();
    let totalNumberOfQuestions = 0;
    const quizTitle = quizData.quiz_title || "Quiz";
    const quizDescription = quizData.quiz_description || "Please answer the questions below.";
    const questionData = quizData.questions;
    const passPercent = quizData.pass_percent;
    const modalTextElement = document.getElementById("modal-text");
    const quizContainerElement = document.getElementById("quiz-container");
    const dialog = document.querySelector("dialog");
    const closeButton = document.getElementById("close-modal-btn");
    const quizTitleElement = document.getElementById("quiz-title");
    const quizDescriptionElement = document.getElementById("quiz-description");

    function main() {
      // update quiz meta data
      document.title = quizTitle;
      quizTitleElement.innerHTML = quizTitle;
      quizDescriptionElement.innerHTML = quizDescription;

      const passPercentElement = document.getElementById("pass-percent");
      passPercentElement.innerHTML = passPercent ? `${passPercent}%` : "N/A";
      totalNumberOfQuestions = questionData.length;
      
      if(closeButton) {
          closeButton.addEventListener("click", () => dialog.close());
      }

      // shuffle the questionData to randomize the order
      for (let i = questionData.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [questionData[i], questionData[j]] = [questionData[j], questionData[i]];
      }

      let formattedQuestions = questionData.map(formatSingleQuestionData);
      updateScore();
      // display the formattedQuestions
      formattedQuestions.forEach((question, idx) => {
        renderSingleQuestion(question, idx + 1);
      });
    }

    /**
     * Formats the raw question data into a more usable structure.
     */
    function formatSingleQuestionData(singleQuizData = null) {
        const { prompt, correct_response, id, assessment_type } = singleQuizData;
        
        const answers = prompt.answers || [];
        // Create a detailed answer object including correctness
        const formattedAnswers = answers.map((answerText, index) => {
            const letter = String.fromCharCode(97 + index); // a, b, c...
            const isCorrect = correct_response.includes(letter);
            return {
                text: answerText,
                isCorrect: isCorrect
            };
        });

        return {
            id: id,
            assessment_type: assessment_type,
            question: prompt.question,
            answers: formattedAnswers, // Use the new formatted answers
            explanation: prompt?.explanation || "",
            feedbacks: prompt.feedbacks
        };
    }

    /**
     * Renders a single question.
     */
    const renderSingleQuestion = (singleQuestionData = {}, rootIndex = 1) => {
        const { id, explanation, answers, question, feedbacks, assessment_type } = singleQuestionData;

        // shuffle the answers to randomize their order
        // for (let i = answers.length - 1; i > 0; i--) {
        //     const j = Math.floor(Math.random() * (i + 1));
        //     [answers[i], answers[j]] = [answers[j], answers[i]];
        // }
        
        const inputType = assessment_type === 'multi-select' ? 'checkbox' : 'radio';
        const inputName = `answer_${id}`; // Unique name for each question group

        const optionsHTML = answers
            .map((option, index) => {
                const optionId = `${id}_${index}`;
                return `
                <div class="question-lable">
                    <input type="${inputType}" id="${optionId}" name="${inputName}" value="${option.text}" data-is-correct="${option.isCorrect}" />
                    <label for="${optionId}">${option.text}</label>
                </div>
                `;
            })
            .join("");

        const container = document.createElement("div");
        container.innerHTML = `
            <form data-question-id="${id}" class="single-question-container" onsubmit="submitButtonListener(event)">
                <div style="display: flex;justify-content: space-between;">
                    <p style="font-weight: 600">Question ${rootIndex}:</p>
                    <button type="button" onclick="renderExplanation(event)" data-feedbacks='${JSON.stringify(feedbacks)}' data-explanation="${explanation}" class="explanation-btn">View Explanation</button>
                </div>
                <p style="margin-bottom: 8px;line-height: 1.5">${question}</p>
                <div class="options-container">
                    ${optionsHTML}
                </div>
                <div style="display: flex; gap: 8px;">
                    <button type="submit" class="button submit-btn">Submit</button>
                </div>
            </form>
        `;
        quizContainerElement.appendChild(container);
    };

    /**
     * Updates the score board.
     */
    function updateScore() {
        const currentPercentageElement = document.getElementById("current-score");
        const correctAnswerElement = document.getElementById("correct-answers");
        const wrongAnswerElement = document.getElementById("wrong-answers");
        correctAnswerElement.innerHTML = correct.size;
        wrongAnswerElement.innerHTML = incorrect.size;
        if (totalNumberOfQuestions > 0) {
            const score = Number((correct.size / totalNumberOfQuestions) * 100).toFixed(0);
            currentPercentageElement.innerHTML = score;
        }
    }

    /**
    * Compares two sets for equality.
    */
    function setsAreEqual(setA, setB) {
        if (setA.size !== setB.size) {
            return false;
        }
        for (const item of setA) {
            if (!setB.has(item)) {
            return false;
            }
        }
        return true;
    }


    /**
     * Handles the form submission for a single question.
     */
    const submitButtonListener = (e) => {
        e.preventDefault();
        const form = e.target;
        const questionId = form.dataset.questionId;
        const inputs = form.querySelectorAll('input[type="radio"], input[type="checkbox"]');
        
        const userSelectedValues = new Set();
        const actualCorrectValues = new Set();
        let hasSelection = false;

        inputs.forEach(input => {
            if (input.checked) {
                userSelectedValues.add(input.value);
                hasSelection = true;
            }
            if (input.dataset.isCorrect === 'true') {
                actualCorrectValues.add(input.value);
            }
        });

        if (!hasSelection) {
            alert("Please select an answer!");
            return;
        }

        const isFullyCorrect = setsAreEqual(userSelectedValues, actualCorrectValues);

        if (isFullyCorrect) {
            correct.add(questionId);
            incorrect.delete(questionId);
        } else {
            incorrect.add(questionId);
            correct.delete(questionId);
        }
        
        updateScore();

        // Apply visual feedback and disable the form
        form.querySelectorAll(".question-lable").forEach(labelContainer => {
            const input = labelContainer.querySelector('input');
            labelContainer.classList.remove("correct-answer", "incorrect-answer");

            // Highlight all correct answers
            if (input.dataset.isCorrect === 'true') {
                labelContainer.classList.add("correct-answer");
            } 
            // Highlight user's incorrect selections
            else if (input.checked && input.dataset.isCorrect === 'false') {
                labelContainer.classList.add("incorrect-answer");
            }
        });

      
    };

    /**
     * Renders the explanation in a modal dialog.
     */
    function renderExplanation(ev) {
        modalTextElement.innerHTML = '';
        const explanation = ev.target.dataset?.explanation;
        const feedbacksString = ev.target.dataset?.feedbacks;
        let contentFound = false;

        if (explanation && explanation.trim() !== "") {
            modalTextElement.innerHTML += explanation;
            contentFound = true;
        }

        if (feedbacksString) {
            try {
                const feedbacks = JSON.parse(feedbacksString);
                feedbacks.forEach(feedback => {
                    if (feedback && feedback.trim() !== "") {
                        modalTextElement.innerHTML += feedback;
                        contentFound = true;
                    }
                });
            } catch (e) {
                console.error("Error parsing feedbacks JSON:", e);
            }
        }

        if (!contentFound) {
            modalTextElement.innerHTML = "<p>No explanation found for this question.</p>";
        }

        dialog.showModal();
        dialog.addEventListener("click", (event) => {
            if (event.target === dialog) {
                dialog.close();
            }
        });
    }
  </script>
