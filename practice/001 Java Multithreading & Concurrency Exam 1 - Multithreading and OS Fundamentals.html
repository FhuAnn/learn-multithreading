: "assessment", "id": 81634214, "assessment_type": "multiple-choice", "prompt": {"question": "<p>We have a process with 2 threads.</p><p><strong><em>Thread A</em></strong> <strong>sleeps 90%</strong> of the time, and <strong>10% </strong>of the time it performs operations like responding to keyboard and mouse events. </p><p><strong><em>Thread B</em></strong> <strong>sleeps 10%</strong> of the time, <strong>90%</strong> of the time it performs heavy computations like matrix multiplications.</p><p>Select the correct statement:</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Thread A spends most of its time sleeping and only a small portion of its time performing operations like responding to keyboard and mouse events. </p><p>This indicates that Thread A is IO bound, as it is waiting for input/output operations to complete. Thread B spends most of its time performing heavy computations like matrix multiplications. </p><p>This indicates that Thread B is CPU bound, as it is utilizing the CPU for its computations.&nbsp; </p><p>By default, the operating system prioritizes IO-bound threads to provide high responsiveness. </p><p><br></p>", "answers": ["<p><strong>Thread A</strong>&nbsp;is IO bound and therefore gets lower priority from the OS by default.</p><p><strong>Thread B</strong> is CPU bound and therefore gets higher priority from the OS by default.</p>", "<p><strong>Thread A</strong>&nbsp;is IO bound and therefore gets higher priority from the OS by default.</p><p><strong>Thread B</strong> is CPU bound and therefore gets lower priority from the OS by default.</p>", "<p><strong>Thread A</strong>&nbsp;is CPU bound and therefore gets lower priority from the OS by default.</p><p><strong>Thread B</strong> is IO bound and therefore gets higher priority from the OS by default.</p>", "<p><strong>Thread A</strong>&nbsp;is CPU bound and therefore gets higher priority from the OS by default.</p><p><strong>Thread B</strong> is IO bound and theref ed by the OS is unknown and changes based on the JVM scheduler</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "Consider the following code:Thread threadA = new Thread( () -&gt; ... );\nthread.setPriority(MAX_PRIORITY);\nthread.start();Which statement is correct?", "related_lectures": []}, {"_class": "assessment", "id": 81634226, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Consider the following code snippet:</p><pre class=\"prettyprint linenums\">public static void main(String [] args) {\n    Thread thread = new Thread(() -&gt; System.out.println(\"Hello from \" +\n                                                      Thread.currentThread().getName()));\n    thread.setName(\"New Thread\");\n    thread.run();\n\n    Thread.sleep(2000);\n}</pre><p>What will be the output of this program?</p>", "relatedLectureIds": "", "feedbacks": ["", "", ""], "explanation": "<p><code>thread.run()</code> does not start the new thread. Instead, it simply runs the <code>run()</code> method of the <code>Runnable</code> object passed into the <code>Thread</code> constructor. </p><p>In other words, the code inside the run method will run in the main thread as soon as <code>thread.run()</code>&nbsp;is executed, which will result in the <code>Hello from main</code>&nbsp; output</p>", "answers": ["<p><code>Hello from main</code> </p>", "<p><code>Hello from New Thread</code> </p>", "<p><code>Hello from Thread-0</code> </p>"]}, "correct_response": ["a"], "section": "", "question_plain": "Consider the following code snippet:public static void main(String [] args) {\n    Thread thread = new Thread(() -&gt; System.out.println(\"Hello from \" +\n                                                      Thread.currentThread().getName()));\n    thread.setName(\"New Thread\");\n    thread.run();\n\n    Thread.sleep(2000);\n}What will be the output of this program?", "related_lectures": []}, {"_class": "assessment", "id": 81634228, "assessment_type": "multiple-cho Name(\"Background thread\");\n    thread.start();\n\n    Thread.sleep(1000);\n    System.out.println(\"Hello from \" + Thread.currentThread().getName());\n}What is going to be the output of the program?", "related_lectures": []}, {"_class": "assessment", "id": 81634230, "assessment_type": "multiple-choice", "prompt": {"answers": ["<p><code>Hello from main</code> </p>", "<pre class=\"prettyprint linenums\">Hello from main\nHello from Background thread</pre>", "<p><code>Hello from Background thread</code> </p>", "<pre class=\"prettyprint linenums\">Hello from Background thread\nHello from main</pre>"], "feedbacks": ["", "", "", ""], "explanation": "<p>The background thread is a daemon thread, so the program will terminate before <code>Hello from Background thread</code> is printed.</p>", "question": "<p>Consider the following program:</p><pre class=\"prettyprint linenums\">    public static void main(String [] args) throws InterruptedException {\n        Thread thread = new Thread(new Runnable() {\n            @Override\n            public void run() {\n                try {\n                    Thread.sleep(3000);\n                } catch (InterruptedException e) {\n                    e.printStackTrace();\n                }\n                System.out.println(\"Hello from \" + Thread.currentThread().getName());\n            }\n        });\n        thread.setName(\"Background thread\");\n\n        thread.setDaemon(true);\n        \n        thread.start();\n\n        Thread.sleep(2000);\n        System.out.println(\"Hello from \" + Thread.currentThread().getName());\n    }</pre><p>What will be the output of this program?</p>", "relatedLectureIds": ""}, "correct_response": ["a"], "section": "", "question_plain": "Consider the following program:    public static void main(String [] args) throws InterruptedException {\n        Thread thread = new Thread(new Runnable() {\n            @Override\n            public void run() {\n                try {\n                    Th sider the following program:</p><pre class=\"prettyprint linenums\">public static void main(String [] args) throws InterruptedException {\n    Thread thread = new Thread(() -&gt; System.out.println(Thread.currentThread().getName() + \" is doing work\"));\n\n    thread.setName(\"thread1\");\n\n    thread.start();\n    Thread.sleep(5000);\n\n    System.out.println(thread.getName() + \" is now in the \" + thread.getState() + \" state\");\n}</pre><p>What will be the output after the completion of the program?</p>", "relatedLectureIds": ""}, "correct_response": ["b"], "section": "", "question_plain": "Consider the following program:public static void main(String [] args) throws InterruptedException {\n    Thread thread = new Thread(() -&gt; System.out.println(Thread.currentThread().getName() + \" is doing work\"));\n\n    thread.setName(\"thread1\");\n\n    thread.start();\n    Thread.sleep(5000);\n\n    System.out.println(thread.getName() + \" is now in the \" + thread.getState() + \" state\");\n}What will be the output after the completion of the program?", "related_lectures": []}, {"_class": "assessment", "id": 81634244, "assessment_type": "multiple-choice", "prompt": {"answers": ["<p>The <code>start()</code> method.</p>", "<p>The <code>run()</code>&nbsp;method.</p>", "<p>The constructor.</p>", "<p>All of the above</p>"], "feedbacks": ["", "", "", ""], "explanation": "<p>The <code>run()</code> method of the <code>Runnable</code> interface, which is implemented by the <code>Thread</code> class, is the method we need to override. This method contains the code which will be executed by the newly created thread.</p>", "question": "<p>We want to run a piece of code on a different thread by extending the <code>Thread</code> class. Which method do we need to override?</p>", "relatedLectureIds": ""}, "correct_response": ["b"], "section": "", "question_plain": "We want to run a piece of code on a different thread by extending the Thread class. Which method do we need to overri
