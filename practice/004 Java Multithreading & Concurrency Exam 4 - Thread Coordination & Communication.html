oduct.result.add(yProduct.result);\n        result = result.add(zProduct.result);\n        return result;\n    }\n      \n    static class Vector {\n        public BigInteger x;\n        public BigInteger y;\n        public BigInteger z;\n    }\n    \n    static class MultiplicationResult {\n        public BigInteger result = BigInteger.ZERO;\n    }  \n}</pre><p><br></p><p>If we call the <code>dotProduct(..)</code> method with the following vectors, what will the method return?</p><p><strong>Input:</strong></p><p><strong>VectorA = (3456554, 48996880, 38383990086)</strong></p><p><strong>VectorB = (368887643, 37000008, 7669885775811110)</strong></p><p><strong>Output: ?</strong></p>", "answers": ["<p>8588585885959674639393847587968574</p>", "<p>-10</p>", "<p>0</p>", "<p>(183737475868675, 8828736354368390488, 9383736356489590600011)</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "Vector multiplication (Also referred to as \u201cdot product\u201d) is a very common and useful operation in both mathematics and physics. It is especially important for game development and computer graphics.The geometric interpretation of a vectorA dot vectorB is defined as the projection of vectorA in the direction of vectorB.&nbsp; See https://en.wikipedia.org/wiki/Dot_product for more information.We want to implement an efficient calculator that takes two 3 dimensional vectors from the user and performs a dot product vector multiplication on them. The values may be very large, so we want to utilize multithreading.public class VectorMultiplication {\n    public BigInteger dotProduct(Vector vectorA, \n                                 VectorB vectorB) {\n\n        MultiplicationResult xProduct = new MultiplicationResult();\n        MultiplicationResult yProduct = new MultiplicationResult();\n        MultiplicationResult zProduct = new MultiplicationResult();\n\n        Thread xMultiplier = new Thread(() -&gt; xProduct.result = vectorA.x.multiply(vectorB.x));\n        Thread yMultiplier = new Thread(() -&gt; yProduct.result = vectorA.y.multiply(vectorB.y));\n        Thread zMultiplier = new Thread(() -&gt; zProduct.result = vectorA.z.multiply(vectorB.z));\n\n        xMultiplier.start();\n        yMultiplier.start();\n        zMultiplier.start();\n\n        BigInteger result = xProduct.result.add(yProduct.result);\n        result = result.add(zProduct.result);\n        return result;\n    }\n      \n    static class Vector {\n        public BigInteger x;\n        public BigInteger y;\n        public BigInteger z;\n    }\n    \n    static class MultiplicationResult {\n        public BigInteger result = BigInteger.ZERO;\n    }  \n}If we call the dotProduct(..) method with the following vectors, what will the method return?Input:VectorA = (3456554, 48996880, 38383990086)VectorB = (368887643, 37000008, 7669885775811110)Output: ?", "related_lectures": []}, {"_class": "assessment", "id": 81634980, "assessment_type": "multi-select", "prompt": {"relatedLectureIds": "", "feedbacks": ["", "", "", "", "", ""], "explanation": "<p>We need to join all the threads with the main thread and wait for them to finish. Note that calling <code>Thread.sleep()</code> will not work consistently for all inputs as the time we need to sleep for will depend on the magnitude of the numbers.</p>", "question": "<p>We realized that we need to make modifications to the vector multiplication code but we are not sure what is the right way to wait for the multiplying threads to finish calculation. Help us decide which code needs to be placed in the <em>MISSING CODE</em> section.</p><p><br></p><pre class=\"prettyprint linenums\">public class VectorMultiplication {\n    public BigInteger dotProduct(Vector vectorA, \n                                 VectorB vectorB) {\n\n        MultiplicationResult xProduct = new MultiplicationResult();\n        MultiplicationResult yProduct = new MultiplicationResult();\n        MultiplicationResult zProduct = new MultiplicationResult();\n\n        Thread xMultiplier = new Thread(() -&gt; xProduct.result = vectorA.x.multiply(vectorB.x));\n        Thread yMultiplier = new Thread(() -&gt; yProduct.result = vectorA.y.multiply(vectorB.y));\n        Thread zMultiplier = new Thread(() -&gt; zProduct.result = vectorA.z.multiply(vectorB.z));\n\n        xMultiplier.start();\n        yMultiplier.start();\n        zMultiplier.start();\n\n        // MISSING CODE\n\n        BigInteger result = xProduct.result.add(yProduct.result);\n        result = result.add(zProduct.result);\n        return result;\n    }\n      \n    static class Vector {\n        public BigInteger x;\n        public BigInteger y;\n        public BigInteger z;\n    }\n    \n    static class MultiplicationResult {\n        public BigInteger result = BigInteger.ZERO;\n    }  \n}</pre><p>Select all the correct solutions that will work for <strong>any input</strong>.</p>", "answers": ["<p><code>this.wait();</code> </p>", "<pre class=\"prettyprint linenums\">xMultiplier.wait();\nyMultiplier.wait();\nzMultiplier.wait();</pre>", "<p><code>Thread.sleep(1000);</code> </p>", "<pre class=\"prettyprint linenums\">xMultiplier.sleep();\nyMultiplier.sleep();\nzMultiplier.sleep();</pre>", "<pre class=\"prettyprint linenums\">xMultiplier.join();\nyMultiplier.join();\nzMultiplier.join();</pre>", "<pre class=\"prettyprint linenums\">Thread.currentThread().join();</pre>"]}, "correct_response": ["e"], "section": "", "question_plain": "We realized that we need to make modifications to the vector multiplication code but we are not sure what is the right way to wait for the multiplying threads to finish calculation. Help us decide which code needs to be placed in the MISSING CODE section.public class VectorMultiplication {\n    public BigInteger dotProduct(Vector vectorA, \n                                 VectorB vectorB) {\n\n        MultiplicationResult xProduct = new MultiplicationResult();\n        MultiplicationResult yProduct = new MultiplicationResult();\n        MultiplicationResult zProduct = new MultiplicationResult();\n\n        Thread xMultiplier = new Thread(() -&gt; xProduct.result = vectorA.x.multiply(vectorB.x));\n        Thread yMultiplier = new Thread(() -&gt; yProduct.result = vectorA.y.multiply(vectorB.y));\n        Thread zMultiplier = new Thread(() -&gt; zProduct.result = vectorA.z.multiply(vectorB.z));\n\n        xMultiplier.start();\n        yMultiplier.start();\n        zMultiplier.start();\n\n        // MISSING CODE\n\n        BigInteger result = xProduct.result.add(yProduct.result);\n        result = result.add(zProduct.result);\n        return result;\n    }\n      \n    static class Vector {\n        public BigInteger x;\n        public BigInteger y;\n        public BigInteger z;\n    }\n    \n    static class MultiplicationResult {\n        public BigInteger result = BigInteger.ZERO;\n    }  \n}Select all the correct solutions that will work for any input.", "related_lectures": []}, {"_class": "assessment", "id": 81634982, "assessment_type": "multi-select", "prompt": {"question": "<p>It turns out that we actually have some time constraints, and we cannot wait beyond <strong>20 seconds</strong> for the calculation to complete. If the computation doesn\u2019t finish within that time frame, we return an empty <code>Result</code> object with the <code>isComplete</code> flag as <code>false</code>.</p><p>Help us decide which code needs to be placed in the <strong>MISSING CODE</strong> section.</p><p><br></p><pre class=\"prettyprint linenums\">public class VectorMultiplication {\n    public Result dotProduct(Vector vectorA, \n                             VectorB vectorB) {\n\n        Result xProduct = new Result();\n        Result yProduct = new Result();\n        Result zProduct = new Result();\n\n        Thread xMultiplier = new Thread(() -&gt; {\n            xProduct.result = vectorA.x.multiply(vectorB.x);\n            xProduct.isComplete = true;\n        });\n\n        Thread yMultiplier = new Thread(() -&gt; {\n            yProduct.result = vectorA.y.multiply(vectorB.y);\n            yProduct.isComplete = true;\n        });\n\n        Thread zMultiplier = new Thread(() -&gt; {\n            zProduct.result = vectorA.z.multiply(vectorB.z);\n            zProduct.isComplete = true;\n        });\n\n        xMultiplier.setDaemon(true);\n        yMultiplier.setDaemon(true);\n        zMultiplier.setDaemon(true);\n\n        xMultiplier.start();\n        yMultiplier.start();\n        zMultiplier.start();\n\n        Result finalResult = new Result();\n\n        // MISSING CODE\n\n        finalResult.result = xProduct.result.add(yProduct.result);\n        finalResult.result = finalResult.result.add(zProduct.result);\n\n        return finalResult;\n    }\n      \n    static class Vector {\n        public BigInteger x;\n        public BigInteger y;\n        public BigInteger z;\n    }\n    \n    static class Result {\n        public BigInteger result = BigInteger.ZERO;\n        public volatile boolean isComplete;\n    }  \n}</pre><p><br></p><p>Select all the correct solutions that will work for any input.</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", "", ""], "explanation": "<p><strong>Option 1</strong></p><p>Notice that all three threads are executing <strong>concurrently</strong>. So if the overall \"budget\" for the entire calculation is <strong>20</strong> seconds, it doesn't matter how we allocate that time among different calls to the <code>Thread.join(..)</code> method. <br>For instance, if <code>xMultiplier</code> terminates within less than <strong>19</strong> seconds, the main thread will wake up and continue to call </p><p><code>yMultiplier.join(500);</code></p><p>and then <code>zMultiplier.join(500);</code></p><p>If <code>xMultiplier</code> did <strong>not</strong> terminate within 19 seconds, the call to <code>xMultiplier.join(19000);</code> will <strong>still return after 19 seconds</strong>, and the main thread will proceed to the next instruction.</p><p>By the time the main thread reaches this line:</p><pre class=\"prettyprint linenums\">finalResult.isComplete = xProduct.isComplete &amp;&amp; yProduct.isComplete &amp;&amp; zProduct.isComplete;    </pre><p>We know that the main thread definitely waited no longer than 20 seconds in total.</p><p>And the result of this expression will depend on whether all the threads indeed finished their calculations.</p><p><strong>Option 2</strong></p><p>This option is incorrect.</p><p>The reason for that is <code>Thread.join()</code> (without an argument)&nbsp;will wait indefinitely if the thread being joined has not been terminated.</p><p><strong>Option 3</strong></p><p>This option is correct.</p><p>Regardless of the time each thread takes to calculate, the call to <code>xMultiplier.join(20000);</code> will not take more than 20 seconds. </p><p>In other words, if <code>xMultiplier</code> terminates earlier, that method will return.</p><p>If <code>xMultiplier</code> does not terminate within 20 seconds, the method will still return after the 20 seconds passed.</p><p>The <code>Thread.isAlive()</code> values of each thread will determine if the calculations have already been completed after those 20 seconds.</p><p>A terminated thread will have this value as false.</p><p><strong>Option 4</strong></p><p>This option is correct, but an unnecessary precise allocation of the remaining time after each call to <code>Thread.join()</code>. </p><p><strong>Option 5</strong></p><p>This option is incorrect.</p><p>Notice that while the vector multiplication calculations are executing concurrently, the main thread is executing the <code>Thread.join()</code> calls, sequentially.</p><p>So, if <code>xMultiplier</code> takes 20 seconds to complete, <code>yMultiplier</code> takes 40, and <code>yMultiplier</code> takes 60, </p><p>the main thread will wait 20 seconds on each <code>Thread.join()</code> call, which is<strong> 60 seconds</strong> in aggregate.</p><p>By the time, it gets to the</p><pre class=\"prettyprint linenums\"> finalResult.isComplete = xProduct.isComplete &amp;&amp; yProduct.isComplete &amp;&amp; zProduct.isComplete;   </pre><p>The result will be true. However, the 20 seconds that we had as our budget will be exceeded by a factor of 3.</p>", "answers": ["<pre class=\"prettyprint linenums\">xMultiplier.join(19000);\nyMultiplier.join(500);\nzMultiplier.join(500);\nfinalResult.isComplete = xProduct.isComplete &amp;&amp; yProduct.isComplete &amp;&amp; zProduct.isComplete;   </pre>", "<pre class=\"prettyprint linenums\">xMultiplier.join(20000);\nyMultiplier.join();\nzMultiplier.join();\nfinalResult.isComplete = xProduct.isComplete &amp;&amp; yProduct.isComplete &amp;&amp; zProduct.isComplete;   </pre>", "<pre class=\"prettyprint linenums\">xMultiplier.join(20000);\nfinalResult.isComplete = !xMultiplier.isAlive() &amp;&amp; !yMultiplier.isAlive() &amp;&amp; !zMultiplier.isAlive();   </pre>", "<pre class=\"prettyprint linenums\">long initialTime = System.currentTimeMillis();\n\nxMultiplier.join(20000);\nlong remainingTime = 20000 - (System.currentTimeMillis() - initialTime);\nif (remainingTime &gt; 0) {\n    yMultiplier.join(remainingTime);\n}\n\nremainingTime = 20000 - (System.currentTimeMillis() - initialTime);\nif (remainingTime &gt; 0) {\n    zMultiplier.join(remainingTime);\n}\nfinalResult.isComplete = xProduct.isComplete &amp;&amp; yProduct.isComplete &amp;&amp; zProduct.isComplete;   </pre>", "<pre class=\"prettyprint linenums\">xMultiplier.join(20000);\nyMultiplier.join(20000);\nzMultiplier.join(20000);\nfinalResult.isComplete = xProduct.isComplete &amp;&amp; yProduct.isComplete &amp;&amp; zProduct.isComplete;   </pre>"]}, "correct_response": ["a", "c", "d"], "section": "", "question_plain": "It turns out that we actually have some time constraints, and we cannot wait beyond 20 seconds for the calculation to complete. If the computation doesn\u2019t finish within that time frame, we return an empty Result object with the isComplete flag as false.Help us decide which code needs to be placed in the MISSING CODE section.public class VectorMultiplication {\n    public Result dotProduct(Vector vectorA, \n                             VectorB vectorB) {\n\n        Result xProduct = new Result();\n        Result yProduct = new Result();\n        Result zProduct = new Result();\n\n        Thread xMultiplier = new Thread(() -&gt; {\n            xProduct.result = vectorA.x.multiply(vectorB.x);\n            xProduct.isComplete = true;\n        });\n\n        Thread yMultiplier = new Thread(() -&gt; {\n            yProduct.result = vectorA.y.multiply(vectorB.y);\n            yProduct.isComplete = true;\n        });\n\n        Thread zMultiplier = new Thread(() -&gt; {\n            zProduct.result = vectorA.z.multiply(vectorB.z);\n            zProduct.isComplete = true;\n        });\n\n        xMultiplier.setDaemon(true);\n        yMultiplier.setDaemon(true);\n        zMultiplier.setDaemon(true);\n\n        xMultiplier.start();\n        yMultiplier.start();\n        zMultiplier.start();\n\n        Result finalResult = new Result();\n\n        // MISSING CODE\n\n        finalResult.result = xProduct.result.add(yProduct.result);\n        finalResult.result = finalResult.result.add(zProduct.result);\n\n        return finalResult;\n    }\n      \n    static class Vector {\n        public BigInteger x;\n        public BigInteger y;\n        public BigInteger z;\n    }\n    \n    static class Result {\n        public BigInteger result = BigInteger.ZERO;\n        public volatile boolean isComplete;\n    }  \n}Select all the correct solutions that will work for any input.", "related_lectures": []}, {"_class": "assessment", "id": 81634958, "assessment_type": "multiple-choice", "prompt": {"relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Since the semaphore is initialized with five permits, that's how many threads can acquire the semaphore and enter the \"some logic\".</p>", "question": "<p>We have ng>10 threads</strong> are attempting to execute the \"<em>some</em> <em>logic\"</em> inside the <code>operation()</code> method concurrently.</p><p>How many threads can be executing the \"<em>some logic\"</em> inside that method in the same time?</p>", "answers": ["<p>1</p>", "<p>4</p>", "<p>5</p>", "<p>10</p>"]}, "correct_response": ["a"], "section": "", "question_plain": "We have the following class:public class SomeSharedResource {     \n    private final Semaphore sem = new Semaphore(5);  \n    \n    public void operation() {        \n        sem.acquire(5);         \n\n        // some logic       \n\n     &nbsp;  sem.release(5);    \n    } \n}10 threads are attempting to execute the \"some logic\" inside the operation() method concurrently.How many threads can be executing the \"some logic\" inside that method in the same time?", "related_lectures": []}, {"_class": "assessment", "id": 81634962, "assessment_type": "multiple-choice", "prompt": {"relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Semaphores are not reenterant, so the first thread will block itself from entering the logic inside <code>operation2()</code> method, and will also block other threads indefinitely.</p>", "question": "<p>We have the following class:</p><pre class=\"prettyprint linenums\">public class SomeSharedResource {     \n    private final Semaphore sem = new Semaphore(1);  \n    \n    public void operation1() {        \n        sem.acquire(); \n        operation2();        \n        // some logic       \n     &nbsp;  sem.release();    \n    } \n\n    private void operation2() {\n        sem.acquire();\n        // some more logic\n        sem.release();\n}</pre><p><strong>10 threads</strong> are calling <code>operation1()</code> method on the same object of the SomeSharedRessource class concurrently.</p><p>How many threads can be executing the <strong>\"<em>some more logic\"</em></strong> inside the <code>operation2()</code> method at the same time?</p>", "answers": ["<p>0</p>", "<p>1</p>", "<p>5</p>", "<p>10</p>"]}, "correct_response": ["a"], "section": "", "question_plain": "We have the following class:public class SomeSharedResource {     \n    private final Semaphore sem = new Semaphore(1);  \n    \n    public void operation1() {        \n        sem.acquire(); \n        operation2();        \n        // some logic       \n     &nbsp;  sem.release();    \n    } \n\n    private void operation2() {\n        sem.acquire();\n        // some more logic\n        sem.release();\n}10 threads are calling operation1() method on the same object of the SomeSharedRessource class concurrently.How many threads can be executing the \"some more logic\" inside the operation2() method at the same time?", "related_lectures": []}, {"_class": "assessment", "id": 81634964, "assessment_type": "multiple-choice", "prompt": {"relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Locks are not designed for inter-thread communication. This implementation won\u2019t work as intended and may even throw an exception in the <code>produce()</code> method when the consumer enters the <code>consume()</code> method because locks can only be unlocked by the <em>lock owner </em>(the thread that successfully acquired the lock).</p>", "question": "<p>We are attempting to implement a producer consumer pattern using locks only and so far we have the following implementation:</p><pre class=\"prettyprint linenums\">public class ProducerConsumer {\n    private final Lock lock = new ReenterantLock();\n    private Item item;\n\n    public void produce(Item item) {\n        this.item = item;\n        lock.unlock();\n    }\n\n    public Item consume() {\n        lock.lock();\n        return this.item;\n}</pre><p>We will have <strong>one producer thread</strong> and <strong>one consumer thread</strong>.<br>Which of the following statements is the most correct?</p>", "answers": ["<p>This works perfectly and can also be used as is for multiple producers and consumers.</p>", "<p>This will work perfectly for one producer and one consumer.</p>", "<p>This will work but may have a race condition.</p>", "<p>This will not work at all.</p>"]}, "correct_response": ["d"], "section": "", "question_plain": "We are attempting to implement a producer consumer pattern using locks only and so far we have the following implementation:public class ProducerConsumer {\n    private final Lock lock = new ReenterantLock();\n    private Item item;\n\n    public void produce(Item item) {\n        this.item = item;\n        lock.unlock();\n    }\n\n    public Item consume() {\n        lock.lock();\n        return this.item;\n}We will have one producer thread and one consumer thread.Which of the following statements is the most correct?", "related_lectures": []}, {"_class": "assessment", "id": 81634966, "assessment_type": "multiple-choice", "prompt": {"relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>The implementation has a race condition. The semaphores are used for coordinating between producer and consumer threads but they do not protect the shared queue from concurrent access and modifications.</p>", "question": "<p>We are attempting to implement a queue with back pressure that limits the number of items to <code>capacity</code>. The implementation should support multiple concurrent producers and consumers.</p><pre class=\"prettyprint linenums\">public class BoundedQueue {\n    private Queue&lt;Item&gt; queue = new LinkedList&lt;&gt;();\n    private Semaphore full = new Semaphore(0);\n    private Semaphore empty;\n\n    public BoundedQueue(int capacity) {\n        this.empty = new Semaphore(capacity);\n    }\n\n    public void produce(Item item) {\n        empty.acquire();\n        queue.offer(item);\n        full.release();\n    }\n\n    public Item consume()&nbsp;{\n        Item item;\n        full.acquire();\n        item = queue.poll();\n        empty.release();\n        return item;\n    }       \n}</pre><p>Select the most correct statement:</p>", "answers": ["<p>The implementation is thread safe but will not limit the queue to the <code>capacity</code>.</p>", "<p>The implementation works as intended and is thread safe.</p>", "<p>The implementation has a race condition and is not thread safe.</p>", "<p>The implementation has a deadlock.</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "We are attempting to implement a queue with back pressure that limits the number of items to capacity. The implementation should support multiple concurrent producers and consumers.public class BoundedQueue {\n    private Queue&lt;Item&gt; queue = new LinkedList&lt;&gt;();\n    private Semaphore full = new Semaphore(0);\n    private Semaphore empty;\n\n    public BoundedQueue(int capacity) {\n        this.empty = new Semaphore(capacity);\n    }\n\n    public void produce(Item item) {\n        empty.acquire();\n        queue.offer(item);\n        full.release();\n    }\n\n    public Item consume()&nbsp;{\n        Item item;\n        full.acquire();\n        item = queue.poll();\n        empty.release();\n        return item;\n    }       \n}Select the most correct statement:", "related_lectures": []}, {"_class": "assessment", "id": 81634968, "assessment_type": "multiple-choice", "prompt": {"relatedLectureIds": "", "feedbacks": ["", "", "", ""], "question": "<p>We are attempting to implement a queue with back pressure that limits the number of items to <code>capacity</code>. The implementation should support multiple concurrent producers and consumers.</p><pre class=\"prettyprint linenums\">public class BoundedQueue {\n    private Queue&lt;Item&gt; queue = new LinkedList&lt;&gt;();\n    private Semaphore full = new Semaphore(0);\n    private Semaphore empty;\n    private Lock lock = new ReenterantLock();\n\n    public BoundedQueue(int capacity) {\n        this.empty = new Semaphore(capacity);\n    }\n\n    public void produce(Item item) {\n        empty.acquire();\n        lock.lock();\n        try {\n            queue.offer(item);\n        } finally {\n            lock.unlock();\n        }\n        full.release();\n    }\n\n    public Item consume()&nbsp;{\n        Item item;\n        full.acquire();\n        lock.lock();\n        try {\n            item = queue.poll();\n        } finally {\n            lock.unlock();\n        }\n        empty.release();\n        return item;\n    }       \n}</pre><p>Select the most correct statement:</p>", "answers": ["<p>The implementation is thread safe but will not limit the queue to the <code>capacity</code>.</p>", "<p>The implementation works as intended and is thread safe.</p>", "<p>The implementation has a race condition and is not thread safe.</p>", "<p>The implementation has a deadlock.</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "We are attempting to implement a queue with back pressure that limits the number of items to capacity. The implementation should support multiple concurrent producers and consumers.public class BoundedQueue {\n    private Queue&lt;Item&gt; queue = new LinkedList&lt;&gt;();\n    private Semaphore full = new Semaphore(0);\n    private Semaphore empty;\n    private Lock lock = new ReenterantLock();\n\n    public BoundedQueue(int capacity) {\n        this.empty = new Semaphore(capacity);\n    }\n\n    public void produce(Item item) {\n        empty.acquire();\n        lock.lock();\n        try {\n            queue.offer(item);\n        } finally {\n            lock.unlock();\n        }\n        full.release();\n    }\n\n    public Item consume()&nbsp;{\n        Item item;\n        full.acquire();\n        lock.lock();\n        try {\n            item = queue.poll();\n        } finally {\n            lock.unlock();\n        }\n        empty.release();\n        return item;\n    }       \n}Select the most correct statement:", "related_lectures": []}, {"_class": "assessment", "id": 81634970, "assessment_type": "multi-select", "prompt": {"relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Every time <strong>Thread B </strong>wakes up from <code>Thread.sleep(..)</code> it consumes CPU. And since it wakes up every 100ms, Thread B may wait up to 100ms after enough users joined and the game was already supposed to start.</p>", "question": "<p>Consider the following Game class:</p><pre class=\"prettyprint linenums\">public class Game {\n    private volatile boolean isStarted;\n\n    public void startGame()&nbsp;{ isStarted = true; }\n\n    public void waitUntilStarted() throws InterruptedException {\n        while (!isStarted) {\n            Thread.sleep(100);\n        }\n        return;\n    }\n}</pre><p><strong>Thread A</strong> and <strong>Thread B</strong> share an instance of the <code>Game</code> class.</p><p><strong>Thread A</strong> calls <code>game.startGame();</code> when enough users join the game.</p><p><strong>Thread B </strong>(the game thread) is waiting by calling the <code>game.waitUntilStarted()</code> method and then starts the game.</p><p>Select all the correct statements.</p>", "answers": ["<p>There is a data race in this class.</p>", "<p>The implementation is correct but isn\u2019t CPU efficient.</p>", "<p>The implementation has a race condition.</p>", "<p>The implementation is not very responsive.</p>"]}, "correct_response": ["b", "d"], "section": "", "question_plain": "Consider the following Game class:public class Game {\n    private volatile boolean isStarted;\n\n    public void startGame()&nbsp;{ isStarted = true; }\n\n    public void waitUntilStarted() throws InterruptedException {\n        while (!isStarted) {\n            Thread.sleep(100);\n        }\n        return;\n    }\n}Thread A and Thread B share an instance of the Game class.Thread A calls game.startGame(); when enough users join the game.Thread B (the game thread) is waiting by calling the game.waitUntilStarted() method and then starts the game.Select all the correct statements.", "related_lectures": []}, {"_class": "assessment", "id": 81634972, "assessment_type": "multiple-choice", "prompt": {"relatedLectureIds": "", "feedbacks": ["", "", ""], "explanation": "<p>Condition variables guarantee that the monitor/lock associated with the condition is acquired when the awaiting thread wakes up. If the thread calling <code>await()</code> does not lock the lock associated with the conditional variable, an <code>IIllegalMonitorStateException</code> is thrown.</p><p>See the following for more details:</p><p><a href=\"https://docs.oracle.com/javase/7/docs/api/java/lang/IllegalMonitorStateException.html\">https://docs.oracle.com/javase/7/docs/api/java/lang/IllegalMonitorStateException.html</a></p>", "question": "<p>We decided to reimplement the Game class using condition variables.</p><pre class=\"prettyprint linenums\">public class Game {\n    private final Lock lock = new ReenterantLock();\n    private Condition started = lock.newCondition();\n\n    public void startGame()&nbsp;{ started.signal(); }\n\n    public void waitUntilStarted() throws InterruptedException {\n        started.await();\n        return;\n    }\n}</pre><p><strong>Thread A</strong> and <strong>Thread B</strong> share an instance of the Game class.</p><p><strong>Thread A </strong>calls <code>game.startGame();</code> when enough users joined the game.</p><p><strong>Thread B</strong> (the game thread) is waiting by calling the <code>game.waitUntiStarted()</code> method and then starts the game.</p><p>Select the most correct statement:</p>", "answers": ["<p>There is a data race in this class</p>", "<p>The implementation is correct and is responsive and CPU efficient </p>", "<p>An <code>IIllegalMonitorStateException</code> will be thrown</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "We decided to reimplement the Game class using condition variables.public class Game {\n    private final Lock lock = new ReenterantLock();\n    private Condition started = lock.newCondition();\n\n    public void startGame()&nbsp;{ started.signal(); }\n\n    public void waitUntilStarted() throws InterruptedException {\n        started.await();\n        return;\n    }\n}Thread A and Thread B share an instance of the Game class.Thread A calls game.startGame(); when enough users joined the game.Thread B (the game thread) is waiting by calling the game.waitUntiStarted() method and then starts the game.Select the most correct statement:", "related_lectures": []}, {"_class": "assessment", "id": 81634974, "assessment_type": "multiple-choice", "prompt": {"relatedLectureIds": "", "feedbacks": ["", "", ""], "explanation": "<p>If <strong>Thread A</strong> completes the <code>startGame()</code> method before <strong>Thread B</strong> enters the <code>waitUntilStarted()</code> method, <strong>Thread B</strong> will miss the signal from <strong>Thread A </strong>and will remain in a waiting state forever. Remember that condition variables have to be associated with actual conditions that must be checked by our code.</p>", "question": "<p>We decided to reimplement the <code>Game</code> class using condition variables and use a lock to guard the condition.</p><pre class=\"prettyprint linenums\">public class Game {\n    private final Lock lock = new ReenterantLock();\n    private Condition started = lock.newCondition();\n\n    public void startGame()&nbsp;{ \n        lock.lock();\n        try {\n            started.signal();\n        } finally {\n            lock.unlock();\n        }\n    }\n\n    public void waitUntilStarted() throws InterruptedException {\n        lock.lock();\n        try {\n            started.await();\n        }&nbsp;finally {\n            lock.unlock();\n        }\n    }\n}</pre><p><strong>Thread A</strong> and <strong>Thread B</strong> share an instance of the <code>Game</code> class.</p><p><strong>Thread A</strong> calls <code>game.startGame();</code> when enough users join the game.</p><p><strong>Thread B </strong>(the game thread) is waiting by calling the <code>game.waitUntiStarted()</code> method and then starts the game.</p><p>Select the most correct statement:</p>", "answers": ["<p>This implementation is correct, responsive and CPU efficient.</p>", "<p>This implementation may result in a deadlock, leaving Thread B blocked forever.</p>", "<p>This implementation has a race condition.</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "We decided to reimplement the Game class using condition variables and use a lock to guard the condition.public class Game {\n    private final Lock lock = new ReenterantLock();\n    private Condition started = lock.newCondition();\n\n    public void startGame()&nbsp;{ \n        lock.lock();\n        try {\n            started.signal();\n        } finally {\n            lock.unlock();\n        }\n    }\n\n    public void waitUntilStarted() throws InterruptedException {\n        lock.lock();\n        try {\n            started.await();\n        }&nbsp;finally {\n            lock.unlock();\n        }\n    }\n}Thread A and Thread B share an instance of the Game class.Thread A calls game.startGame(); when enough users join the game.Thread B (the game thread) is waiting by calling the game.waitUntiStarted() method and then starts the game.Select the most correct statement:", "related_lectures": []}, {"_class": "assessment", "id": 81634976, "assessment_type": "multi-select", "prompt": {"relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>All of the options are equally correct and efficient for this use case.</p>", "question": "<p>Finally we decided to implement the Game class in 3 different ways.</p><p><strong>Option 1:</strong></p><pre class=\"prettyprint linenums\">public class Game {\n    private final Lock lock = new ReenterantLock();\n    private final Condition startedCondition = lock.newCondition();\n    private boolean isStated;\n\n    public void startGame()&nbsp;{ \n        lock.lock();\n        try {\n            isStarted = true;\n            startedCondition.signal();\n        } finally {\n            lock.unlock();\n        }\n    }\n\n    public void waitUntilStarted() throws InterruptedException {\n\n        lock.lock();\n        try {\n            while(!isStarted) {\n                startedCondition.await();\n            }\n        }&nbsp;finally {\n            lock.unlock();\n        }\n    }\n}</pre><p><strong>Option 2:</strong></p><pre class=\"prettyprint linenums\">public class Game {\n    private boolean isStarted;\n\n    public synchronized void startGame()&nbsp;{ \n        isStarted = true;\n        this.notify();\n    }\n\n    public synchronized void waitUntilStarted() throws InterruptedException {\n\n        while(!started) {\n            this.wait();\n        }\n    }\n}</pre><p><strong>Option 3:</strong></p><pre class=\"prettyprint linenums\">public class Game \n    private final Semaphore semaphore = new Semaphore(0);\n\n    public void startGame()&nbsp;{ \n        semaphore.release();\n    }\n\n    public synchronized void waitUntilStarted() {\n        semaphore.acquire(); \n    }\n}</pre><p><br>As before,</p><p><strong>Thread A</strong> and <strong>Thread B</strong> share an instance of the <code>Game</code> class.</p><p><strong>Thread A</strong> calls <code>game.startGame();</code> when enough users join the game.</p><p><strong>Thread B</strong> (the game thread) is waiting by calling the <code>game.waitUntiStarted()</code> method and then starts the game.</p><p>Select all the correct statements.</p>", "answers": ["<p>Option 1 is correct, responsive and CPU efficient </p>", "<p>Option 2 is correct, responsive and CPU efficient </p>", "<p>Option 3 is correct, responsive and CPU efficient </p>", "<p>All of the options are incorrect </p>"]}, "correct_response": ["a", "b", "c"], "section": "", "question_plain": "Finally we decided to implement the Game class in 3 different ways.Option 1:public class Game {\n    private final Lock lock = new ReenterantLock();\n    private final Condition startedCondition = lock.newCondition();\n    private boolean isStated;\n\n    public void startGame()&nbsp;{ \n        lock.lock();\n        try {\n            isStarted = true;\n            startedCondition.signal();\n        } finally {\n            lock.unlock();\n        }\n    }\n\n    public void waitUntilStarted() throws InterruptedException {\n\n        lock.lock();\n        try {\n            while(!isStarted) {\n                startedCondition.await();\n            }\n        }&nbsp;finally {\n            lock.unlock();\n        }\n    }\n}Option 2:public class Game {\n    private boolean isStarted;\n\n    public synchronized void startGame()&nbsp;{ \n        isStarted = true;\n        this.notify();\n    }\n\n    public synchronized void waitUntilStarted() throws InterruptedException {\n\n        while(!started) {\n            this.wait();\n        }\n    }\n}Option 3:public class Game \n    private final Semaphore semaphore = new Semaphore(0);\n\n    public void startGame()&nbsp;{ \n        semaphore.release();\n    }\n\n    public synchronized void waitUntilStarted() {\n        semaphore.acquire(); \n    }\n}As before,Thread A and Thread B share an instance of the Game class.Thread A calls game.startGame(); when enough users join the game.Thread B (the game thread) is waiting by calling the game.waitUntiStarted() method and then starts the game.Select all the correct statements.", "related_lectures": []}, {"_class": "assessment", "id": 81634984, "assessment_type": "multiple-choice", "prompt": {"relatedLectureIds": "", "feedbacks": ["", "", ""], "explanation": "<p>Just calling the <code>interrupt()</code> method on a thread object does not interrupt the thread, it just sets the interrupted flag, which needs to be checked programmatically inside our thread code.</p>", "question": "<p>We have a class called <code>ConnectionPool</code> that maintains a pool of connections to different services based on their addresses.</p><pre class=\"prettyprint linenums\">public class ConnectionPool {\n    //...\n    \n    public void read(String address) {\n        Buffer buffer = new Buffer();\n        Connection connection = getConnection();\n        while (connection.hasMoreData()) {\n             buffer.append(connection.read()); // blocks for 1ms at most\n        }\n        writeToFile(buffer);\n        connection.close();\n    }    \n}</pre><p>(<em>You can assume that </em><code><em>getConnection()</em></code><em> and </em><code><em>writeToFile()</em></code><em> are implemented and are thread safe.)</em></p><p>We want to use the connection pool to read data from multiple services by using multiple threads. We want to read as much data as possible at a given time. After the time has passed or all data has been read, we write the data to a file.</p><p>To perform the parallel reading we use the following code:</p><pre class=\"prettyprint linenums\">public class TimedReader {\n    private ConnectionPool ConnectionPool;\n     \n    public void read(List&lt;String&gt; addresses, long timeout) throws InterruptedException {\n\n        List&lt;Thread&gt; readerThreads = new ArrayList&lt;&gt;();\n        for (String address : addresses) {\n            readerThreads.add(new Thread(() -&gt; connectionPool.read()));\n        }\n           \n        for&nbsp;(Thread readerThread : readerThreads) {\n            readerThread.setDaemon(true);\n            readerThread.start();\n        }\n        \n        Thread.sleep(timeout);\n\n        readerThreads.stream().foreach(thread -&gt; thread.interrupt());\n    }       \n}</pre><p>Please select the correct statement:</p>", "answers": ["<p>The threads created inside the <code>TimedReader.read()</code> will be correctly interrupted after the <code>timeout</code> has passed, and all the data that has been read will be correctly written to the file.</p>", "<p>The threads created inside the <code>TimedReader.read()</code> will be correctly interrupted after the <code>timeout</code> has passed, but some data may be lost.</p>", "<p>The threads created inside the <code>TimedReader.read()</code> will not be interrupted at all until the program terminates, and some data may be lost.</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "We have a class called ConnectionPool that maintains a pool of connections to different services based on their addresses.public class ConnectionPool {\n    //...\n    \n    public void read(String address) {\n        Buffer buffer = new Buffer();\n        Connection connection = getConnection();\n        while (connection.hasMoreData()) {\n             buffer.append(connection.read()); // blocks for 1ms at most\n        }\n        writeToFile(buffer);\n        connection.close();\n    }    \n}(You can assume that getConnection() and writeToFile() are implemented and are thread safe.)We want to use the connection pool to read data from multiple services by using multiple threads. We want to read as much data as possible at a given time. After the time has passed or all data has been read, we write the data to a file.To perform the parallel reading we use the following code:public class TimedReader {\n    private ConnectionPool ConnectionPool;\n     \n    public void read(List&lt;String&gt; addresses, long timeout) throws InterruptedException {\n\n        List&lt;Thread&gt; readerThreads = new ArrayList&lt;&gt;();\n        for (String address : addresses) {\n            readerThreads.add(new Thread(() -&gt; connectionPool.read()));\n        }\n           \n        for&nbsp;(Thread readerThread : readerThreads) {\n            readerThread.setDaemon(true);\n            readerThread.start();\n        }\n        \n        Thread.sleep(timeout);\n\n        readerThreads.stream().foreach(thread -&gt; thread.interrupt());\n    }       \n}Please select the correct statement:", "related_lectures": []}, {"_class": "assessment", "id": 81634986, "assessment_type": "multiple-choice", "prompt": {"question": "<p>We modifie
