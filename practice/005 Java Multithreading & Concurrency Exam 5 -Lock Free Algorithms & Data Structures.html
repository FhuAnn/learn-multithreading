    const quizData = {"pass_percent": 70, "questions": [{"_class": "assessment", "id": 76401068, "assessment_type": "multi-select", "prompt": {"question": "<p>What <strong>possible</strong> issues may we have if we use <strong>locks</strong> in our application?<br>Select all the correct answers</p>", "feedbacks": ["", "", "", "", "", "", ""], "relatedLectureIds": "", "answers": ["<p>Race conditions </p>", "<p>Deadlocks</p>", "<p>All threads may become as slow as the slowest thread while they wait for one thread to complete a long critical section</p>", "<p>Priority inversion (a low priority thread is blocking a high priority thread)</p>", "<p>Performance overhead of a context switch when a thread gets blocked trying to acquire a lock that belongs to another thread</p>", "<p>A thread not releasing a lock (while being stuck or crashing) and leaving all the other threads hanging</p>", "<p>Locks make applications less memory efficient </p>"]}, "correct_response": ["b", "c", "d", "e", "f"], "section": "", "question_plain": "What possible issues may we have if we use locks in our application?Select all the correct answers", "related_lectures": []}, {"_class": "assessment", "id": 76401080, "assessment_type": "multiple-choice", "prompt": {"question": "<p>We have the follow code</p><pre class=\"prettyprint linenums\">AtomicInteger atomicInteger = new AtomicInteger(10);\n\nif (atomicInteger.compareAndSet(5, 7)) {\n    System.out.println(\u201cDogs are loyal\u201d);\n} else if (atomicInteger.compareAndSet(10, 3)) {\n    System.out.println(\u201cCats are cute\u201d);\n} else {\n    System.out.println(\u201cBunnies love lettuce\u201d);\n}\nSystem.out.println(\u201cThe value of atomicInteger is \u201c + atomicInteger.get();\n</pre><p>What is the output of this code?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", "", ""], "answers": ["<pre class=\"prettyprint linenums\">Dogs are loyal\nThe value of atomicInteger is 7</pre>", "<pre class=\"prettyprint linenums\">Dogs are trong>.</p><p>Similarly, because n4 and n1 refer to the same object, they contain the same reference.</p><p>So <code>atomicN1.compareAndSet(n4, n2);</code> also returns <strong>true</strong>.</p>", "answers": ["<pre class=\"prettyprint linenums\">atomicN1.compareAndSet(n2, n1);</pre>", "<pre class=\"prettyprint linenums\">atomicN1.compareAndSet(n3, n4);</pre>", "<pre class=\"prettyprint linenums\">atomicN1.compareAndSet(n1, n4);</pre>", "<pre class=\"prettyprint linenums\">atomicN1.compareAndSet(n4, n2);</pre>"]}, "correct_response": ["c", "d"], "section": "", "question_plain": "We have the following class that represents a Node in a tree.public class Node {\n    private final int key;\n    private final int value;\n\n    public Node(int key, int value) {\n        this.key = key;\n        this.value = value;\n    }\n\n    public int getKey() {\n        return key;\n    }\n\n    public int getValue() {\n        return value;\n    } \n}We have the following code:Node n1 = new Node(1,&nbsp;5);\nNode n2 = new Node(17, 11);\nNode n3 = new Node(1, 5);\nNode n4 = n1;\n\nAtomicReference&lt;Node&gt; atomicN1 = new AtomicReference&lt;&gt;(n1);Which of the following returns true?", "related_lectures": []}, {"_class": "assessment", "id": 76401070, "assessment_type": "multiple-choice", "prompt": {"question": "<p>We have the following class:</p><pre class=\"prettyprint linenums\">public class InventoryCounter {\n    private final AtomicInteger counter = new AtomicInteger(0);\n\n    public void increment() {\n        this.counter.incrementAndGet();\n    }\n\n    public void decrement() {\n        this.counter.decrementAndGet();\n    }\n\n    public void add(int delta) {\n        this.counter.getAndAdd(delta);\n    }\n\n    public int get() {\n        return counter.get();\n    }\n}\n</pre><p><strong>3 threads</strong> are sharing a reference to the InventoryCounter:</p><pre class=\"prettyprint linenums\">InventoryCounter inventoryCounter - new InventoryCounter();\nThread thread1 = new Thread(() -&gt; {\n    for (int i = 0; i &lt; 10_000; i++) {\n        inventoryCounter.increment();\n    }\n});\n\nThread thread2 = new Thread(() -&gt; {\n    for (int i = 0; i &lt; 10_000; i++) {\n        inventoryCounter.decrement();\n    }\n});\n\nThread thread3 = new Thread(() -&gt; {\n    for (int i = 0; i &lt; 10_000; i++) {\n        inventoryCounter.getAndAdd(2);\n    }\n});\n\nthread1.join();\nthread2.join();\nthread3.join();\n\nSystem.out.println(\u201ccount is \u201c + inventoryCounter.get());</pre><p>What is going to be the output of this program?</p>", "relatedLectureIds": "", "feedbacks": ["", "", ""], "answers": ["<p>0</p>", "<p>20000</p>", "<p>We can\u2019t know for certain because there is a race condition</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "We have the following class:public class InventoryCounter {\n    private final AtomicInteger counter = new AtomicInteger(0);\n\n    public void increment() {\n        this.counter.incrementAndGet();\n    }\n\n    public void decrement() {\n        this.counter.decrementAndGet();\n    }\n\n    public void add(int delta) {\n        this.counter.getAndAdd(delta);\n    }\n\n    public int get() {\n        return counter.get();\n    }\n}\n3 threads are sharing a reference to the InventoryCounter:InventoryCounter inventoryCounter - new InventoryCounter();\nThread thread1 = new Thread(() -&gt; {\n    for (int i = 0; i &lt; 10_000; i++) {\n        inventoryCounter.increment();\n    }\n});\n\nThread thread2 = new Thread(() -&gt; {\n    for (int i = 0; i &lt; 10_000; i++) {\n        inventoryCounter.decrement();\n    }\n});\n\nThread thread3 = new Thread(() -&gt; {\n    for (int i = 0; i &lt; 10_000; i++) {\n        inventoryCounter.getAndAdd(2);\n    }\n});\n\nthread1.join();\nthread2.join();\nthread3.join();\n\nSystem.out.println(\u201ccount is \u201c + inventoryCounter.get());What is going to be the output of this program?", "related_lectures": []}, {"_class": "assessment", "id": 76401072, "assessment_type": "multiple-choice", "prompt": {"question": "<p>We have the following class:</p><pre class=\"prettyprint linenums\">public class SharedClass&nbsp;{\n    private final AtomicInteger x = new AtomicInteger(0);\n    private final AtomicInteger y = new AtomicInteger(0);\n\n    public void incrementBoth() {\n        x.incrementAndGet();\n        y.incrementAndGet();\n    }\n\n    public void testForDataRace() {\n        if (y.get() &gt; x.get()) {\n           throw new RuntimeException(\u201cdata race is detected\u201d);        \n        }\n    }\n}</pre><pre class=\"prettyprint linenums\">public static void main(String [] args) {\n    SharedClass sharedObject = new SharedClass();\n    \n    Thread thread1 = new Thread(() -&gt; {\n        for (int i = 0; i &lt; Integer.MAX_VALUE; i++) {\n            sharedObject.incrementBoth();\n        }\n    });  \n\n    Thread thread2 = new Thread(() -&gt; {\n        for (int i = 0; i &lt; Integer.MAX_VALUE; i++) {\n            sharedObject.testForDataRace();\n        }\n    });   \n\n    thread1.join();   \n    thread2.join();  \n}</pre><p>Select the correct statement</p>", "relatedLectureIds": "", "feedbacks": ["", "", ""], "explanation": "<p>The values wrapped by Atomic classes are already \u201c<em>volatile</em>\u201d internally so we don\u2019t have data races when we use them</p>", "answers": ["<p>The program will finish without any exception or output</p>", "<p>The program will always throw the \u201cdata race is detected\u201d exception. We need to declare x and y <em>volatile</em></p>", "<p>The program will sometimes throw the \u201cdata race is detected\u201d exception. We need to declare x and y <em>volatile</em></p>"]}, "correct_response": ["a"], "section": "", "question_plain": "We have the following class:public class SharedClass&nbsp;{\n    private final AtomicInteger x = new AtomicInteger(0);\n    private final AtomicInteger y = new AtomicInteger(0);\n\n    public void incrementBoth() {\n        x.incrementAndGet();\n        y.incrementAndGet();\n    }\n\n    public void testForDataRace() {\n        if (y.get() &gt; x.get()) {\n           throw new RuntimeException(\u201cdata race is detected\u201d);        \n        }\n    }\n}public static void main(String [] args) {\n    SharedClass sharedObject = new SharedClass();\n    \n    Thread thread1 = new Thread(() -&gt; {\n        for (int i = 0; i &lt; Integer.MAX_VALUE; i++) {\n            sharedObject.incrementBoth();\n        }\n    });  \n\n    Thread thread2 = new Thread(() -&gt; {\n        for (int i = 0; i &lt; Integer.MAX_VALUE; i++) {\n            sharedObject.testForDataRace();\n        }\n    });   \n\n    thread1.join();   \n    thread2.join();  \n}Select the correct statement", "related_lectures": []}, {"_class": "assessment", "id": 76401074, "assessment_type": "multiple-choice", "prompt": {"question": "<p>We have a class that represents a 2D location in space:</p><pre class=\"prettyprint linenums\">public class Location {\n    public volatile int x;\n    public volatile int y;\n    \n    public Location(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n}</pre><p>In our 2D game we have multiple threads that update the locations of our game characters and objects in space by incrementing/decrementing both the x and y coordinates of their locations.</p><p>Currently we have a <strong>blocking</strong> implementation for the GameCharacter class as follows</p><pre class=\"prettyprint linenums\">public class GameCharacter {\n    private Location currentLocation = new Location(0, 0);\n\n    public synchronized void move(int deltaX, int deltaY) {\n        currentLocation = new Location(currentLocation.x + deltaX, currentLocation.y + deltaY);\n    }\n}\n</pre><p>We want to change this implementation to be fully <strong>non-blocking</strong> and<strong> lock-free</strong>.</p><p>Which class can help us achieve such an implementation?</p>", "feedbacks": ["", "", "", ""], "relatedLectureIds": "", "answers": ["<p><code>AtomicInteger</code> </p>", "<p><code>AtomicLong</code> </p>", "<p><code>AtomicReference</code> </p>", "<p><code>ConcurrentHashMap</code> </p>"], "explanation": "<p>Since the location is an object, we will need to wrap its reference with an <code>AtomicReference</code>.</p>"}, "correct_response": ["c"], "section": "", "question_plain": "We have a class that represents a 2D location in space:public class Location {\n    public volatile int x;\n    public volatile int y;\n    \n    public Location(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n}In our 2D game we have multiple threads that update the locations of our game characters and objects in space by incrementing/decrementing both the x and y coordinates of their locations.Currently we have a blocking implementation for the GameCharacter class as followspublic class GameCharacter {\n    private Location currentLocation = new Location(0, 0);\n\n    public synchronized void move(int deltaX, int deltaY) {\n        currentLocation = new Location(currentLocation.x + deltaX, currentLocation.y + deltaY);\n    }\n}\nWe want to change this implementation to be fully non-blocking and lock-free.Which class can help us achieve such an implementation?", "related_lectures": []}, {"_class": "assessment", "id": 76401076, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Following up on the previous question:</p><p>We have a class that represents a 2D location in space:</p><pre class=\"prettyprint linenums\">public class Location {\n    public volatile int x;\n    public volatile int y;\n    \n    public Location(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n}</pre><p>In our 2D game, we have multiple threads that update the locations of our game characters and objects in space by incrementing/decrementing both the x and y coordinates of their locations.</p><p>We updated the <code>GameCharacter</code> to use an <code>AtomicReference</code> so we can have a lock-free, non-blocking implementation.</p><pre class=\"prettyprint linenums\">public class GameCharacter {\n    private final AtomicReference&lt;Location&gt; currentLocationReference = new AtomicReference&lt;&gt;(new Location(0, 0));\n\n    public void move(int deltaX, int deltaY) {\n        Location currentLocation = currentLocationReference.get();\n        \n        currentLocation.set(new Location(currentLocation.x + deltaX, currentLocation.y + deltaY));\n    }         \n}\n</pre><p>Select the correct statement.</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Although inside the <code>move</code> method, each separate operation is atomic, the entire <code>move</code> method is not atomic altogether.</p>", "answers": ["<p>This implementation has a deadlock</p>", "<p>This implementation works as intended</p>", "<p>This implementation may still block</p>", "<p>This implementation has a race condition </p>"]}, "correct_response": ["d"], "section": "", "question_plain": "Following up on the previous question:We have a class that represents a 2D location in space:public class Location {\n    public volatile int x;\n    public volatile int y;\n    \n    public Location(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n}In our 2D game, we have multiple threads that update the locations of our game characters and objects in space by incrementing/decrementing both the x and y coordinates of their locations.We updated the GameCharacter to use an AtomicReference so we can have a lock-free, non-blocking implementation.public class GameCharacter {\n    private final AtomicReference&lt;Location&gt; currentLocationReference = new AtomicReference&lt;&gt;(new Location(0, 0));\n\n    public void move(int deltaX, int deltaY) {\n        Location currentLocation = currentLocationReference.get();\n        \n        currentLocation.set(new Location(currentLocation.x + deltaX, currentLocation.y + deltaY));\n    }         \n}\nSelect the correct statement.", "related_lectures": []}, {"_class": "assessment", "id": 76401078, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Following up on the previous question:</p><p>We have a class that represents a 2D location in space:</p><pre class=\"prettyprint linenums\">public class Location {\n    public volatile int x;\n    public volatile int y;\n    \n    public Location(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n}</pre><p>In our 2D game, we have multiple threads that update the locations of our game characters and objects in space by incrementing/decrementing both the x and y coordinates of their locations.</p><p>We updated the <code>GameCharacter</code> <strong>again</strong> to use an <code>AtomicReference</code> so we can have a lock-free, non-blocking implementation.</p><pre class=\"prettyprint linenums\">public class GameCharacter {\n    private final AtomicReference&lt;Location&gt; currentLocationReference = new AtomicReference&lt;&gt;(new Location(0, 0));\n\n    public void move(int deltaX, int deltaY) {\n        Location currentLocation;\n        Location newLocation;\n        \n        do {\n            currentLocation = currentLocationReference.get();\n            newLocation = new Location(currentLocation.x + deltaX, currentLocation.y + deltaY);\n        } while (!currentLocationReference.compareAndSet(currentLocation, newLocation));\n    }         \n}\n</pre><p>Select the correct statement.</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>This implementation has a deadlock</p>", "<p>This implementation works as intended</p>", "<p>This implementation may still block</p>", "<p>This implementation has a race condition </p>"]}, "correct_response": ["b"], "section": "", "question_plain": "Following up on the previous question:We have a class that represents a 2D location in space:public class Location {\n    public volatile int x;\n    public volatile int y;\n    \n    public Location(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n}In our 2D game, we have multiple threads that update the locations of our game characters and objects in space by incrementing/decrementing both the x and y coordinates of their locations.We updated the GameCharacter again to use an AtomicReference so we can have a lock-free, non-blocking implementation.public class GameCharacter {\n    private final AtomicReference&lt;Location&gt; currentLocationReference = new AtomicReference&lt;&gt;(new Location(0, 0));\n\n    public void move(int deltaX, int deltaY) {\n        Location currentLocation;\n        Location newLocation;\n        \n        do {\n            currentLocation = currentLocationReference.get();\n            newLocation = new Location(currentLocation.x + deltaX, currentLocation.y + deltaY);\n        } while (!currentLocationReference.compareAndSet(currentLocation, newLocation));\n    }         \n}\nSelect the correct statement.", "related_lectures": []}, {"_class": "assessment", "id": 76401082, "assessment_type": "multiple-choice", "prompt": {"question": "<p>We want to expand the <code>Sequencer</code> class, which provides its users a unique and monotonically increasing sequence number in a thread-safe way:</p><pre class=\"prettyprint linenums\">public class Sequencer {\n   private final AtomicLong sequenceNumber = new AtomicLong(0);\n\n   public long getNextNumber() {\n     return sequenceNumber.getAndIncrement();\n   } \n }</pre><p>The modification we want to make is to make the <code>Sequencer</code> return only <strong>even numbers starting from 0</strong>. (0, 2, 4, 6, ...)</p><p>We also want to keep the class<strong> lock-free</strong>.</p><p>What would the new implementation of the <code>getNextNumber</code> look like?</p><p>(Try to write it yourself before looking at the answers)&nbsp; &nbsp;</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Notice that </p><pre class=\"prettyprint linenums\">public long getNextNumber() {\n     sequenceNumber.getAndIncrement();\n     return sequenceNumber.getAndIncrement();\n}</pre><p>is not atomic as it has 2 operations. There may be a race condition which would lead to a thread getting an odd number. Also notice the difference between <code>getAndAdd()</code> and <code>addAndGet()</code>. They both increment the value but return the previous and the latest values respectively.</p>", "answers": ["<pre class=\"prettyprint linenums\">public long getNextNumber() {\n     sequenceNumber.getAndIncrement();\n     return sequenceNumber.getAndIncrement();\n}</pre>", "<pre class=\"prettyprint linenums\">public long getNextNumber() {\n     return sequenceNumber.addAndGet(2);\n}</pre>", "<pre class=\"prettyprint linenums\">public synchronized long getNextNumber() {\n     sequenceNumber.getAndIncrement();\n     return sequenceNumber.getAndIncrement();\n}</pre>", "<pre class=\"prettyprint linenums\">public long getNextNumber() {\n     return sequenceNumber.getAndAdd(2);\n}</pre>"]}, "correct_response": ["d"], "section": "", "question_plain": "We want to expand the Sequencer class, which provides its users a unique and monotonically increasing sequence number in a thread-safe way:public class Sequencer {\n   private final AtomicLong sequenceNumber = new AtomicLong(0);\n\n   public long getNextNumber() {\n     return sequenceNumber.getAndIncrement();\n   } \n }The modification we want to make is to make the Sequencer return only even numbers starting from 0. (0, 2, 4, 6, ...)We also want to keep the class lock-free.What would the new implementation of the getNextNumber look like?(Try to write it yourself before looking at the answers)&nbsp; &nbsp;", "related_lectures": []}, {"_class": "assessment", "id": 76401084, "assessment_type": "multiple-choice", "prompt": {"relatedLectureIds": "", "question": "<p>We want to expand the <code>Sequencer</code> class, which provides its users a non-negative and monotonically increasing sequence number in a thread-safe way:</p><pre class=\"prettyprint linenums\">public class Sequencer {\n   private final AtomicLong sequenceNumber = new AtomicLong(0);\n\n   public long getNextNumber() {\n     return sequenceNumber.getAndIncrement();\n   } \n }</pre><p><strong>This time we want to keep the numbers from overflowing and becoming negative.</strong></p><p>The solution we are proposing is, once we reach <code>Long.MAX_VALUE</code>, we want to wrap around and start returning numbers starting from 0.</p><p>We want to keep the class lock-free.</p><p>What is the new correct implementation of the <code>getNextNumber()</code> method?</p><p>(Try to write the code yourself before looking at the answers.)</p>", "feedbacks": ["", "", "", ""], "explanation": "<p>Notice that</p><pre class=\"prettyprint linenums\">public long getNextNumber() {\n    sequenceNumber.compareAndSet(Long.MAX_VALUE, 0); \n    return sequenceNumber.incrementAndGet();\n} </pre><p>Has a race condition.</p><p>3 threads can be entering while sequenceNumber is equal to <code>Long.MAX_VALUE - 1</code> and pass the&nbsp; &nbsp; &nbsp;<code>sequenceNumber.compareAndSet(Long.MAX_VALUE, 0);</code> line without modifications to the <code>sequenceNumber</code> variable.</p><p>The 3rd thread will return a negative value because <code>sequenceNumber</code> will overflow.</p>", "answers": ["<pre class=\"prettyprint linenums\">public long getNextNumber() {\n    if&nbsp;(sequenceNumber.get() == Long.MAX_VALUE) {\n        sequenceNumber.set(0);\n    }\n    return sequenceNumber.getAndIncrement();\n} </pre>", "<pre class=\"prettyprint linenums\">public long getNextNumber() {\n    return sequenceNumber.incrementAndGet();\n} </pre>", "<pre class=\"prettyprint linenums\">public long getNextNumber() {\n    sequenceNumber.compareAndSet(Long.MAX_VALUE, 0); \n    return sequenceNumber.incrementAndGet();\n} </pre>", "<pre class=\"prettyprint linenums\">public long getNextNumber() {\n    long currentNumber;\n    long nextNumber;\n    do {\n        currentNumber = sequenceNumber.get();\n        nextNumber = currentNumber &lt; Long.MAX_VALUE \n                     ? currentNumber +&nbsp;1\n                     : 0;\n        \n    } while&nbsp;(!sequenceNumber.compareAndSet(currentNumber, nextNumber);\n    return currentNumber;\n} </pre>"]}, "correct_response": ["d"], "section": "", "question_plain": "We want to expand the Sequencer class, which provides its users a non-negative and monotonically increasing sequence number in a thread-safe way:public class Sequencer {\n   private final AtomicLong sequenceNumber = new AtomicLong(0);\n\n   public long getNextNumber() {\n     return sequenceNumber.getAndIncrement();\n   } \n }This time we want to keep the numbers from overflowing and becoming negative.The solution we are proposing is, once we reach Long.MAX_VALUE, we want to wrap around and start returning numbers starting from 0.We want to keep the class lock-free.What is the new correct implementation of the getNextNumber() method?(Try to write the code yourself before looking at the answers.)", "related_lectures": []}, {"_class": "assessment", "id": 76401086, "assessment_type": "multiple-choice", "prompt": {"question": "<pre class=\"prettyprint linenums\">AtomicInteger x = new AtomicInteger();\nint y = 0;</pre><p>Why is <code>x.incrementAndGet()</code> atomic but <code>y++</code> is not?</p>", "relatedLectureIds": "", "feedbacks": ["", "", ""], "explanation": "<p>Atomic classes in Java are using the lowest level implementations of the individual instructions that run atomically in the CPU.</p>", "answers": ["<p><code>incrementAndGet()</code> is implemented as a single hardware instruction in the CPU but <code>y++</code> is implemented as 3 instructions </p>", "<p>Because the class is called <code>AtomicInteger</code> and is part of the Java Atomic package</p>", "<p>Because <code>incrementAndGet()</code> uses a lock and <code>y++</code> doesn't</p>"]}, "correct_response": ["a"], "section": "", "question_plain": "AtomicInteger x = new AtomicInteger();\nint y = 0;Why is x.incrementAndGet() atomic but y++ is not?", "related_lectures": []}]};
