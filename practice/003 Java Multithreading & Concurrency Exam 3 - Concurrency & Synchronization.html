  <script>
    const quizData = {"pass_percent": 70, "questions": [{"_class": "assessment", "id": 79690278, "assessment_type": "multi-select", "prompt": {"explanation": "<p>Class member variables are part of an object of that class and will be allocated on the heap. Method arguments and local variables are allocated on the stack.</p>", "answers": ["<p><code>newAge</code> variable in <code>updateAge</code> method is allocated on the <strong>heap</strong></p>", "<p><code>newAge</code> variable in <code>updateAge</code> method is allocated on the <strong>stack</strong></p>", "<p><code>newAge</code> variable in <code>incrementAge</code> is allocated on the <strong>heap</strong></p>", "<p><code>newAge</code> variable in <code>incrementAge</code> is allocated on the <strong>stack</strong></p>", "<p><code>age</code> is allocated on the <strong>heap</strong></p>", "<p><code>age</code> is allocated on the <strong>stack</strong></p>"], "question": "<p>Consider the following code:</p><pre class=\"prettyprint linenums\">public class Employee {\n    private int age;\n    private final String firstName;\n    private final String lastName;\n\n    public Employee(int age, String firstName, String lastName) {\n        this.age = age;\n        this.firstName = firstName;\n        this.lastName = lastName;\n    }\n\n    public void updateAge(int newAge) {\n        this.age = newAge;\n    }\n\n    public void incrementAge() {\n        int newAge = this.age + 1;\n        this.age = newAge;\n    }\n}</pre><p>Select all the correct statements:</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", "", "", ""]}, "correct_response": ["b", "d", "e"], "section": "", "question_plain": "Consider the following code:public class Employee {\n    private int age;\n    private final String firstName;\n    private final String lastName;\n\n    public Employee(int age, String firstName, String lastName) {\n        this.age = age;\n        this.firstName = firstName;\n        this.lastName = lastName;\n    }\n\n    public void updateAge(int newAge) {\n        this.age = newAge;\n    }\n\n    public void incrementAge() {\n        int newAge = this.age + 1;\n        this.age = newAge;\n    }\n}Select all the correct statements:", "related_lectures": []}, {"_class": "assessment", "id": 79690280, "assessment_type": "multiple-choice", "prompt": {"explanation": "<p>Objects are always allocated on the heap by default.</p>", "answers": ["<p>The <code>Request</code> object created in the <code>createNewRequest</code> method is allocated on the <strong>heap</strong></p>", "<p>The <code>Request</code> object created in the <code>createNewRequest</code> method is allocated on the <strong>stack</strong></p>", "<p>The <code>Request</code> object created in the <code>createNewRequest</code> method is allocated both on the <strong>stack</strong> and on the <strong>heap</strong></p>"], "question": "<p>Consider the following code:</p><pre class=\"prettyprint linenums\">public class Session {\n    private Request activeRequest;\n    \n    public void createNewRequest(String address) {\n        Request newRequest = new Request(address);\n        this.activeRequest = newRequest;\n    }\n}</pre><p>Select the correct statement:</p>", "relatedLectureIds": "", "feedbacks": ["", "", ""]}, "correct_response": ["a"], "section": "", "question_plain": "Consider the following code:public class Session {\n    private Request activeRequest;\n    \n    public void createNewRequest(String address) {\n        Request newRequest = new Request(address);\n        this.activeRequest = newRequest;\n    }\n}Select the correct statement:", "related_lectures": []}, {"_class": "assessment", "id": 79690282, "assessment_type": "multiple-choice", "prompt": {"explanation": "<p>We have two copies of a reference to the created object. One is stored in a local variable called <code>newRequest</code> inside the <code>createNewRequest</code> method. And the second copy is stored in a class member variable called <code>activeRequest</code>, which is stored on the heap as part of the <code>Session</code> object, when created.</p>", "answers": ["<p>The reference to the <code>Request</code> object created in the <code>createNewRequest</code> method is stored on the <strong>heap</strong>.</p>", "<p>The reference to the <code>Request</code> object created in the <code>createNewRequest</code> method is stored on the <strong>stack</strong>.</p>", "<p>The reference to the <code>Request</code> object created in the <code>createNewRequest</code> method is stored both on the <strong>stack</strong> and the <strong>heap</strong>. </p>"], "question": "<p>Consider the following code:</p><pre class=\"prettyprint linenums\">public class Session {\n    private Request activeRequest;\n    \n    public void createNewRequest(String address) {\n        Request newRequest = new Request(address);\n        this.activeRequest = newRequest;\n    }\n}</pre><p>Select the correct statement:</p>", "relatedLectureIds": "", "feedbacks": ["", "", ""]}, "correct_response": ["c"], "section": "", "question_plain": "Consider the following code:public class Session {\n    private Request activeRequest;\n    \n    public void createNewRequest(String address) {\n        Request newRequest = new Request(address);\n        this.activeRequest = newRequest;\n    }\n}Select the correct statement:", "related_lectures": []}, {"_class": "assessment", "id": 79690284, "assessment_type": "multi-select", "prompt": {"question": "<p>Consider the following code:</p><pre class=\"prettyprint linenums\">public class SharedResource {\n    public synchronized void operation1() {\n        //critical section\n    }\n    \n    public void operation2() {\n        synchronized (this) {\n            //critical section\n        }\n    }\n   \n    public void operation3() {\n        // some code\n    }\n}</pre><p>Two objects of the SharedResource class are created:</p><pre class=\"prettyprint linenums\">SharedResource sharedResourceInstance1 = new SharedResource();\nSharedResource sharedResourceInstance2 = new SharedResource();</pre><p>We know that:</p><p><strong>Thread1</strong> and <strong>Thread2</strong> have access to <code>sharedResourceInstance1</code></p><p><strong>Thread3</strong> and <strong>Thread4</strong> have access to <code>sharedResourceInstance2</code>.</p><p>Select all that applies:</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", "", ""], "explanation": "<p>Marking a method <code>synchronized</code> is logically equivalent to surrounding its internal logic with a <code>synchronized(this)</code>. </p><p>Synchronization is done on an object level, so threads synchronize with each other only when they share the same object in a class. </p><p>Different objects of the same class have no effect on each other when it comes to synchronization.</p>", "answers": ["<p>While <strong>Thread1</strong> is executing the critical section inside <code>operation1()</code>,</p><p><strong>Thread2</strong> can execute the critical section inside <code>operation2()</code> </p>", "<p>While <strong>Thread1</strong> is executing the critical section inside <code>operation1()</code>,</p><p><strong>Thread2</strong> can execute the code inside <code>operation3()</code> </p>", "<p>While <strong>Thread1</strong> is executing the critical section inside <code>operation1()</code>,</p><p><strong>Thread3</strong> can execute the critical section inside <code>operation2()</code> </p>", "<p>While <strong>Thread3</strong> is executing the critical section inside <code>operation1()</code>,</p><p><strong>Thread4</strong> can execute the critical section inside <code>operation1()</code> </p>", "<p>While <strong>Thread1</strong> is executing the code inside <code>operation3()</code>,</p><p><strong>Thread2</strong> can execute the&nbsp; <code>operation3()</code> </p>"]}, "correct_response": ["b", "c", "e"], "section": "", "question_plain": "Consider the following code:public class SharedResource {\n    public synchronized void operation1() {\n        //critical section\n    }\n    \n    public void operation2() {\n        synchronized (this) {\n            //critical section\n        }\n    }\n   \n    public void operation3() {\n        // some code\n    }\n}Two objects of the SharedResource class are created:SharedResource sharedResourceInstance1 = new SharedResource();\nSharedResource sharedResourceInstance2 = new SharedResource();We know that:Thread1 and Thread2 have access to sharedResourceInstance1Thread3 and Thread4 have access to sharedResourceInstance2.Select all that applies:", "related_lectures": []}, {"_class": "assessment", "id": 79690286, "assessment_type": "multi-select", "prompt": {"explanation": "<p>Since <code>increment()</code> is not synchronized, we have a race condition inside it. Depending on the different ways that two threads are scheduled, we may have different outcomes which are 1 and 2 in this case.</p>", "answers": ["<p>0</p>", "<p>1</p>", "<p>2</p>"], "question": "<p>Observe the following class:</p><pre class=\"prettyprint linenums\">public class CounterWrapper {\n    private int counter = 0;\n    \n    public void increment() {\n        counter = counter + 1;\n    }\n}</pre><p>- <strong>2 threads</strong> share the same <code>CounterWrapper</code> object.</p><p>- Both threads execute the <code>increment()</code> method on that object.</p><p>What are <strong>all</strong> the possible values of the <code>counter</code> variable, after both threads complete the execution of the <code>increment()</code>?</p>", "relatedLectureIds": "", "feedbacks": ["", "", ""]}, "correct_response": ["b", "c"], "section": "", "question_plain": "Observe the following class:public class CounterWrapper {\n    private int counter = 0;\n    \n    public void increment() {\n        counter = counter + 1;\n    }\n}- 2 threads share the same CounterWrapper object.- Both threads execute the increment() method on that object.What are all the possible values of the counter variable, after both threads complete the execution of the increment()?", "related_lectures": []}, {"_class": "assessment", "id": 79690288, "assessment_type": "multi-select", "prompt": {"explanation": "<p>Similarly to the previous question, <code>increment()</code> is not synchronized and because of the race condition, we may have different values of count depending on the order of scheduling the threads. Try to find all the possible combinations of scheduling the threads to achieve the above values.</p>", "answers": ["<p>0</p>", "<p>1</p>", "<p>2</p>", "<p>3</p>"], "question": "<p>Observe the following class:</p><pre class=\"prettyprint linenums\">public class CounterWrapper {\n    private int counter = 0;\n    \n    public void increment() {\n        counter = counter + 1;\n    }\n}</pre><p> - <strong>3 threads</strong> have the same <code>CounterWrapper</code> object.</p><p> - Both threads execute the <code>increment()</code> method on that object.</p><p>What are <strong>all</strong> the possible values of the <code>counter</code> variable, after both threads complete the execution of the <code>increment()</code>?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""]}, "correct_response": ["b", "c", "d"], "section": "", "question_plain": "Observe the following class:public class CounterWrapper {\n    private int counter = 0;\n    \n    public void increment() {\n        counter = counter + 1;\n    }\n} - 3 threads have the same CounterWrapper object. - Both threads execute the increment() method on that object.What are all the possible values of the counter variable, after both threads complete the execution of the increment()?", "related_lectures": []}, {"_class": "assessment", "id": 79690290, "assessment_type": "multi-select", "prompt": {"explanation": "<p>Notice that because we have a <code>for</code> loop and essentially we have <code>count = count +&nbsp;1</code> twice in each method, we cannot achieve the value 1 at the end. However, all the other values from 2 to 4 are possible because of different scheduling orders of the threads.</p>", "answers": ["<p>0</p>", "<p>1</p>", "<p>2</p>", "<p>3</p>", "<p>4</p>", "<p>5</p>", "<p>-1</p>"], "question": "<p>Observe the following class:</p><pre class=\"prettyprint linenums\">public class CounterWrapper {\n    private int counter = 0;\n    \n    public void incrementTwice() {\n        for (int i = 0; i &lt; 2; i++) {\n            counter = counter + 1;\n        }\n    }\n}</pre><p> - <strong>2 threads</strong> have the same <code>CounterWrapper</code> object.</p><p> - Both threads execute the <code>incrementTwice()</code> method on that object.</p><p>What are <strong>all</strong> the possible values of the <code>counter</code> variable, after both threads complete the execution of the <code>incrementTwice()</code>?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", "", "", "", ""]}, "correct_response": ["c", "d", "e"], "section": "", "question_plain": "Observe the following class:public class CounterWrapper {\n    private int counter = 0;\n    \n    public void incrementTwice() {\n        for (int i = 0; i &lt; 2; i++) {\n            counter = counter + 1;\n        }\n    }\n} - 2 threads have the same CounterWrapper object. - Both threads execute the incrementTwice() method on that object.What are all the possible values of the counter variable, after both threads complete the execution of the incrementTwice()?", "related_lectures": []}, {"_class": "assessment", "id": 79690292, "assessment_type": "multiple-choice", "prompt": {"explanation": "<p>The <code>synchronized</code> keyword placed in front of a <code>static</code> method in a class synchronizes threads on the <code>Class</code> object. Each class has only one <code>Class</code> object, so all the threads calling <code>synchronized static</code> methods will contend with each other.</p>", "answers": ["<p>Only one thread can enter the body of the <code>incrementX()</code> method at a given time, therefore incrementing x is safe.</p>", "<p>Both threads can enter the body of the <code>incrementX()</code> method at the same time, therefore incrementing x is NOT safe.</p>", "<p>Only one thread can enter the body of the <code>incrementX()</code> method at a given time, but incrementing x is not thread-safe.</p>"], "question": "<p>Observe the following class:</p><pre class=\"prettyprint linenums\">public class MyClass {\n    private static int x = 0;\n    private static int y = 0;\n    \n    public synchronized static void incrementX() {\n        x++;\n    }\n    \n    public synchronized void incrementY() {\n        y++;\n    }\n}</pre><p><strong>Two threads</strong> are executing the following code concurrently:</p><p><code>MyClass.incrementX();</code> </p><p>Please select the correct statement:</p>", "relatedLectureIds": "", "feedbacks": ["", "", ""]}, "correct_response": ["a"], "section": "", "question_plain": "Observe the following class:public class MyClass {\n    private static int x = 0;\n    private static int y = 0;\n    \n    public synchronized static void incrementX() {\n        x++;\n    }\n    \n    public synchronized void incrementY() {\n        y++;\n    }\n}Two threads are executing the following code concurrently:MyClass.incrementX(); Please select the correct statement:", "related_lectures": []}, {"_class": "assessment", "id": 79690294, "assessment_type": "multiple-choice", "prompt": {"explanation": "<p>Since both threads are sharing the same instance of the class, they are contending with each other on entering the critical section guarded by the <code>synchronized</code> keyword on the <code>incrementY()</code>.</p>", "answers": ["<p>Only one thread can enter the body of the <code>incrementY()</code> method and therefore it is safe to increment y this way.</p>", "<p>Both threads can enter the body of the <code>incrementY()</code> method and therefore it is NOT safe to increment y this way.</p>"], "question": "<p>Observe the following class:</p><pre class=\"prettyprint linenums\">public class MyClass {\n    private static int x = 0;\n    private static int y = 0;\n    \n    public synchronized static void incrementX() {\n        x++;\n    }\n    \n    public synchronized void incrementY() {\n        y++;\n    }\n}</pre><p><strong>Two threads</strong> share the <strong>same object</strong> of the <code>MyClass</code> class, and are executing the following code concurrently:</p><p><code>myClassObject.incrementY();</code> </p><p>Please select the correct statement:</p>", "relatedLectureIds": "", "feedbacks": ["", ""]}, "correct_response": ["a"], "section": "", "question_plain": "Observe the following class:public class MyClass {\n    private static int x = 0;\n    private static int y = 0;\n    \n    public synchronized static void incrementX() {\n        x++;\n    }\n    \n    public synchronized void incrementY() {\n        y++;\n    }\n}Two threads share the same object of the MyClass class, and are executing the following code concurrently:myClassObject.incrementY(); Please select the correct statement:", "related_lectures": []}, {"_class": "assessment", "id": 79690296, "assessment_type": "multiple-choice", "prompt": {"answers": ["<p>Only one thread can access the body of the <code>incrementY()</code> method and it is therefore safe to increment y.</p>", "<p>Both threads can enter <code>incrementY()</code> method in the same time, but because both threads operate on different objects it is safe to increment y this way.</p>", "<p>Both threads can enter <code>incrementY()</code> method in the same time, since y is a static variable, both threads will modify and read the same variable, which is NOT&nbsp;thread safe. Therefore it is not safe to increment y this way.</p>"], "question": "<p>Observe the following class:</p><pre class=\"prettyprint linenums\">public class MyClass {\n    private static int x = 0;\n    private static int y = 0;\n    \n    public synchronized static void incrementX() {\n        x++;\n    }\n    \n    public synchronized void incrementY() {\n        y++;\n    }\n}</pre><p><strong>Thread 1</strong> has an object of <code>MyClass</code>:</p><pre class=\"prettyprint linenums\">MyClass object1 = new MyClass();</pre><p><strong>Thread 2</strong> has another object of <code>MyClass</code>:</p><pre class=\"prettyprint linenums\">MyClass object2 = new MyClass();</pre><p><br></p><p>Both threads are executing the following code <strong>concurrently</strong>:</p><pre class=\"prettyprint linenums\">object1.incrementY(); // thread 1</pre><pre class=\"prettyprint linenums\">object2.incrementY(); // thread 2</pre><p>Select the correct statement:</p>", "relatedLectureIds": "", "feedbacks": ["", "", ""]}, "correct_response": ["c"], "section": "", "question_plain": "Observe the following class:public class MyClass {\n    private static int x = 0;\n    private static int y = 0;\n    \n    public synchronized static void incrementX() {\n        x++;\n    }\n    \n    public synchronized void incrementY() {\n        y++;\n    }\n}Thread 1 has an object of MyClass:MyClass object1 = new MyClass();Thread 2 has another object of MyClass:MyClass object2 = new MyClass();Both threads are executing the following code concurrently:object1.incrementY(); // thread 1object2.incrementY(); // thread 2Select the correct statement:", "related_lectures": []}, {"_class": "assessment", "id": 79690298, "assessment_type": "multi-select", "prompt": {"explanation": "<p><code>x</code> is a local variable and is therefore allocated on the <strong>stack</strong>. Each thread has its own stack so the only value <code>x</code> can have is 1.</p><p>The order of the execution of the threads is indeterministic, therefore we have 2 options.</p>", "answers": ["<pre class=\"prettyprint linenums\">thread-0: The new value of x is 1</pre><pre class=\"prettyprint linenums\">thread-1: The new value of x is 1</pre>", "<pre class=\"prettyprint linenums\">thread-0: The new value of x is 2</pre><pre class=\"prettyprint linenums\">thread-1: The new value of x is 2</pre>", "<pre class=\"prettyprint linenums\">thread-0: The new value of x is 1</pre><pre class=\"prettyprint linenums\">thread-1: The new value of x is 2</pre>", "<pre class=\"prettyprint linenums\">thread-1: The new value of x is 1</pre><pre class=\"prettyprint linenums\">thread-0: The new value of x is 1</pre>", "<pre class=\"prettyprint linenums\">thread-0: The new value of x is 2</pre><pre class=\"prettyprint linenums\">thread-1: The new value of x is 1</pre>"], "question": "<p>We have the following class:</p><pre class=\"prettyprint linenums\">    public class SharedClass {\n        public synchronized static void incrementX() {\n            int x = 0;\n            //...\n            x++;\n            System.out.println(Thread.currentThread().getName() + \n                    \": The new value of x is \" + x);\n        }\n    }</pre><p>Two threads share the <strong>same</strong> object of <code>SharedClass</code> and execute the following code concurrently:</p><p><code>sharedObject.incrementX();</code> </p><p>Select all the possible outputs of the program:</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", "", ""]}, "correct_response": ["a", "d"], "section": "", "question_plain": "We have the following class:    public class SharedClass {\n        public synchronized static void incrementX() {\n            int x = 0;\n            //...\n            x++;\n            System.out.println(Thread.currentThread().getName() + \n                    \": The new value of x is \" + x);\n        }\n    }Two threads share the same object of SharedClass and execute the following code concurrently:sharedObject.incrementX(); Select all the possible outputs of the program:", "related_lectures": []}, {"_class": "assessment", "id": 79690300, "assessment_type": "multi-select", "prompt": {"explanation": "<p>Assignments to and from all variables except for <code>double</code> and <code>long</code> are atomic. Assignments to and from <code>volatile double</code> and <code>volatile long</code> are atomic. All other operations are not atomic.</p>", "answers": ["<pre class=\"prettyprint linenums\">public void sharpenColor(int units) {\n    colorValue += units;\n}</pre>", "<pre class=\"prettyprint linenums\">public void getColorValue() {\n    return colorValue;\n}</pre>", "<pre class=\"prettyprint linenums\">public void getBitrate() {\n    return bitrate;\n}</pre>", "<pre class=\"prettyprint linenums\">public void getCompressionLevel() {\n    return compressionLevel;\n}</pre>", "<pre class=\"prettyprint linenums\">public void setNumberOfPixels(long numberOfPixels) {\n    numberOfPixels = 0;\n}</pre>", "<pre class=\"prettyprint linenums\">public void freeze() {\n    frameRate = 0;\n}</pre>", "<pre class=\"prettyprint linenums\">public void appendToName(String suffix) {\n    frameName = frameName + suffix;\n}</pre>", "<pre class=\"prettyprint linenums\">public void doubleFrameRate(){\n    frameRate = frameName &lt;&lt; 1;\n}</pre>"], "question": "<p>Given this class:</p><pre class=\"prettyprint linenums\">public class MovieFrame&nbsp;{\n    int colorValue;\n    long numberOfPixels;\n    float frameRate;\n    volatile double compressionLevel;\n    double bitrate;\n    String frameName;\n}</pre><p>Which of the following operations are atomic?</p><p>Note:&nbsp;The variables are not correlated and modifying one does not have any effect on the other.</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", "", "", "", "", ""]}, "correct_response": ["b", "d", "f"], "section": "", "question_plain": "Given this class:public class MovieFrame&nbsp;{\n    int colorValue;\n    long numberOfPixels;\n    float frameRate;\n    volatile double compressionLevel;\n    double bitrate;\n    String frameName;\n}Which of the following operations are atomic?Note:&nbsp;The variables are not correlated and modifying one does not have any effect on the other.", "related_lectures": []}, {"_class": "assessment", "id": 79690302, "assessment_type": "multiple-choice", "prompt": {"explanation": "<p>Global coarse grain locking is a lot simpler because we only have one lock to maintain and with one lock we will never have to deal with deadlocks.</p>", "answers": ["<p>Option 1</p>", "<p>Option 2</p>", "<p>Both are equally easy</p>"], "question": "<p>We have the following basic implementation of a Binary Search Tree (https://en.wikipedia.org/wiki/Binary_search_tree)</p><pre class=\"prettyprint linenums\">public class BinarySearchTree {\n    public Node root;\n\n    public static class Node {\n        public Node left;\n        public Node right;\n        public int key;\n    }\n}</pre><p>We would like to add methods to the BinarySearchTree class to allow different traversals:</p><p>-&nbsp; <em>left most leaf</em> to <em>right most leaf</em></p><p>- Same level traversal</p><p>- In-Order</p><p>- Pre-Order</p><p>- Post-Order</p><p>As well as the following operations:</p><p>- Addition of a new node</p><p>- Removal of an existing node</p><p><strong>Note: You do not need to know how to implement all those operations.</strong></p><p>We want to allow all such operations to be executed by different threads that respond to different client's requests.</p><p>To make sure all those operations are thread safe we have the following 2 locking options:</p><p><strong>Option 1 - Global Lock</strong></p><pre class=\"prettyprint linenums\">public class BinarySearchTree {\n    public Node root;\n\n    private Lock treeLock = new ReenterantLock();\n\n    public static class Node {\n        public Node left;\n        public Node right;\n        public int key;\n    }\n}</pre><p>In this option, every operation will acquire the <code>treeLock</code> at the beginning and unlock it at the end.</p><p><strong>Option 2 - Per Node Lock</strong></p><pre class=\"prettyprint linenums\">public class BinarySearchTree {\n    public Node root;\n\n    public static class Node {\n        public Node left;\n        public Node right;\n i-select", "prompt": {"explanation": "<p>The four conditions that must be present to create a deadlock are Mutual Exclusion, Non-preemptive Allocation, Hold and Wait, and Circular Wait. We can eliminate the possibility of a deadlock by avoiding at least one of those conditions, typically the Circular Wait.</p>", "answers": ["<p><strong>Mutual Exclusion</strong> - Only one thread can have exclusive access to a resource</p>", "<p><strong>All</strong> threads are non-daemon threads</p>", "<p><strong>Non-preemtive allocation -</strong> A resource is released only after a thread is done using it</p>", "<p><strong>Hold and Wait </strong>- At least one thread is holding a resource while it's waiting for another resource </p>", "<p><strong>Increment and Get </strong>- At least one thread is incrementing a variable and another is reading it</p>", "<p><strong>Circular Wait </strong>- A chain of at least 2 threads where each one is holding one resource and is waiting for another resource</p>", "<p>The priority of at least one thread is <strong>MAX_PRIORITY </strong></p>"], "question": "<p>Which of the following conditions are essential to create a deadlock?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", "", "", "", ""]}, "correct_response": ["a", "c", "d", "f"], "section": "", "question_plain": "Which of the following conditions are essential to create a deadlock?", "related_lectures": []}, {"_class": "assessment", "id": 79690328, "assessment_type": "multi-select", "prompt": {"explanation": "<p>References:</p><p><a href=\"https://docs.oracle.com/javase/specs/jls/se14/html/jls-8.html#jls-8.3.1.4\">Volatile Fields</a></p><p><a href=\"https://docs.oracle.com/javase/specs/jls/se14/html/jls-17.html#jls-17.7\">Non Atomic Treatment of double and long</a></p><p>it\u2019s important to point out that volatile has <strong>no</strong> effect on CPU caches. In fact nothing can directly tell the CPU to store or not to store data in its caches. CPU caches are an internal, micro-architecture optimization and an implementation detail of the CPU that neither software developers nor OS developers have any control over.</p><p>In addition, CPU caches are always in sync through <a href=\"https://en.wikipedia.org/wiki/Cache_coherence\">Cache Coherency protocols</a> like <a href=\"https://en.wikipedia.org/wiki/MOESI_protocol\">MOESI</a> and are not related to data races whatsoever.</p>", "answers": ["<p>Makes all operations on <code>volatile</code> variables atomic</p>", "<p>Makes <strong>assignments</strong> to <code>int</code> and <code>float</code> atomic</p>", "<p>Makes <strong>assignments</strong> to <code>double</code> and <code>long</code> atomic</p>", "<p>Ensures that all threads see consistent value of a variable</p>", "<p>Disables compiler optimizations that may lead to data races</p>", "<p>Prevents all race conditions</p>", "<p>Prevents data to be stored in CPU caches and makes every read or write to/from a volatile variable happen in the main memory</p>"], "question": "<p>What are the different meanings of the <code>volatile</code> keyword?</p><p>Select all the correct answers:</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", "", "", "", ""]}, "correct_response": ["c", "d", "e"], "section": "", "question_plain": "What are the different meanings of the volatile keyword?Select all the correct answers:", "related_lectures": []}]};
